  function destroyTurret(t, dir) {
    Sound.play('destroy', t.x, t.y);
    t.sparkT = 4;
    burst(t.x, t.y, '#FFB347', 30, 230); burst(t.x, t.y, '#FFFFFF', 8, 120);
    rings.push({ x: t.x, y: t.y, r: 8, life: 0.4, max: 0.4 });
    addSmoke(t.x, t.y, 9, true);
    bakeScorch({ x: t.x, y: t.y, r: 24 });
    addDebris(t.x, t.y, dir, [[16, 5, '#2E3841'], [7, 5, '#707D88'], [6, 4, '#56636E'], [5, 5, '#56636E'], [3, 3, '#3A424A']]);
  }
  function woundAlly(a, dir) {
    a.fallT = 0; a.fallAng = dir; a.startAng = a.ang;
    a.gunDir = dir + (Math.random() < 0.5 ? 1 : -1) * (1 + Math.random() * 0.6);
    burst(a.x, a.y, '#FF5A3C', 12, 130);
  }
  function updateEffects(dt) {
    const f = Math.pow(0.02, dt);
    for (const p of debris) {
      if (Math.abs(p.vx) + Math.abs(p.vy) < 3) continue;
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
      if (blockedAt(nx, ny, 1) || nx < WALL + 2 || nx > W - WALL - 2 || ny < WALL + 2 || ny > H - WALL - 2) { p.vx *= -0.35; p.vy *= -0.35; }
      else { p.x = nx; p.y = ny; }
      p.vx *= f; p.vy *= f; p.rot += p.vr * dt; p.vr *= f;
    }
    for (let i = smokes.length - 1; i >= 0; i--) {
      const s = smokes[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.r += s.grow * dt; s.life -= dt;
      if (s.dust) { s.vx *= 0.9; s.vy *= 0.9; }
      if (s.life <= 0) smokes.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.r += 130 * dt; r.life -= dt; if (r.life <= 0) rings.splice(i, 1); }
    for (const u of [...droids, ...turrets]) {
      if (u.hp > 0 || u.sparkT <= 0) continue;
      u.sparkT -= dt; if (u.deadT !== undefined) u.deadT += dt;
      if (Math.random() < dt * 5) burst(u.x + (Math.random() - 0.5) * 8, u.y + (Math.random() - 0.5) * 8, '#FFE08A', 3, 70);
      if (Math.random() < dt * 2.5) addSmoke(u.x, u.y, 1, false);
    }
    for (const a of allies) {
      if (a.hp > 0 || a.fallT > 0.5) continue;
      const prev = a.fallT; a.fallT += dt;
      const e0 = 1 - Math.pow(1 - Math.min(1, prev / 0.45), 3), e1 = 1 - Math.pow(1 - Math.min(1, a.fallT / 0.45), 3);
      const nx = a.x + Math.cos(a.fallAng) * 12 * (e1 - e0), ny = a.y + Math.sin(a.fallAng) * 12 * (e1 - e0);
      if (!blockedAt(nx, ny, 8)) { a.x = nx; a.y = ny; }
    }
  }

  function burst(x, y, color, n, spd) {
    if (sparks.length > 450) n = Math.min(n, 2);   // plafond pour les grosses mêlées
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random());
      sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.25 + Math.random() * 0.3, max: 0.55, color });
    }
  }


  // ---------- arme du joueur ----------
  function updatePlayerWeapon(dt, av, ml, mx, my) {
    const pc = player.cls;
    player.cd -= dt;
    const mw = mouse.active && !isTouch ? { x: mouse.x / scale + camX, y: mouse.y / scale + camY } : null;
    player.heavyPreview = null;

    if (pc === 'lourd') {
      if (player.reloadT > 0) { player.reloadT -= dt; if (player.reloadT <= 0) { player.reloadT = 0; player.loaded = true; Sound.play('reloadDone'); } }
      if (player.rocketsLeft <= 0) player.weapon = 'pistol';
      if (player.weapon === 'pistol') {
        let firing = false;
        if (av) { player.aim = Math.atan2(av.y, av.x); firing = true; }
        else if (mw) { player.aim = Math.atan2(mw.y - player.y, mw.x - player.x); firing = mouse.down; }
        else if (ml > 0.1) player.aim = Math.atan2(my, mx);
        if (keys[' ']) firing = true;
        if (firing && player.cd <= 0) { fireBolt(player, player.aim, 420, PISTOL_DMG, 'pistol'); player.cd = 0.5; }
        player.heavyWasAiming = false;
        return;
      }
      // joystick droit : direction + distance (longueur du geste), relâcher pour tirer ; revenir au centre annule
      let pt = null, fire = false, preview = false;
      if (av) {
        const dist = 40 + av.m * (ROCKET_RANGE - 40);
        pt = { x: player.x + av.x * dist, y: player.y + av.y * dist };
        player.aim = Math.atan2(av.y, av.x); player.heavyWasAiming = true; player.heavyLast = pt; preview = true;
      } else if (sticks.aim) {
        player.heavyWasAiming = false;
      } else if (player.heavyWasAiming) {
        player.heavyWasAiming = false; pt = player.heavyLast; fire = true;
      } else if (mw) {
        const dx = mw.x - player.x, dy = mw.y - player.y, d = Math.hypot(dx, dy) || 1, k = Math.min(d, ROCKET_RANGE) / d;
        pt = { x: player.x + dx * k, y: player.y + dy * k };
        player.aim = Math.atan2(dy, dx); fire = mouse.down; preview = true;
      } else if (ml > 0.1) player.aim = Math.atan2(my, mx);
      if (keys[' ']) { pt = { x: player.x + Math.cos(player.aim) * ROCKET_RANGE, y: player.y + Math.sin(player.aim) * ROCKET_RANGE }; fire = true; }
      if (pt) {
        const imp = predictImpact(player.x, player.y, pt.x, pt.y);
        if (preview) player.heavyPreview = imp;
        if (fire && player.loaded) { fireRocket(player, imp); player.loaded = false; player.rocketsLeft--; }
      }
      return;
    }

    if (pc === 'sniper') {
      if (player.lock) {
        const t = player.lock.tgt;
        if (t.hp <= 0 || !onScreen(t)) player.lock = null;
        else { const was = player.lock.t; player.lock.t += dt; if (was < 1 && player.lock.t >= 1) Sound.play('lockDone'); }
      }
      let manual = false;
      if (av) { player.aim = Math.atan2(av.y, av.x); manual = true; }
      else if (mw && mouse.down) { player.aim = Math.atan2(mw.y - player.y, mw.x - player.x); manual = true; }
      else if (player.lock && player.lock.t >= 1) { const t = player.lock.tgt; player.aim = Math.atan2(t.y - player.y, t.x - player.x); }
      else if (mw) player.aim = Math.atan2(mw.y - player.y, mw.x - player.x);
      else if (ml > 0.1) player.aim = Math.atan2(my, mx);
      if (keys[' ']) manual = true;
      if (player.cd <= 0) {
        if (manual) { fireBolt(player, player.aim, 900, 2, 'snipe'); player.cd = 1.2; }
        else if (player.lock && player.lock.t >= 1 && lockLineClear(player, player.lock.tgt)) {
          const t = player.lock.tgt;
          fireBolt(player, player.aim, 900, 2, 'snipe', t); player.cd = 1.2;
        }
      }
      return;
    }

    // classique et médecin
    let firing = false;
    if (av) { player.aim = Math.atan2(av.y, av.x); firing = true; }
    else if (mw) { player.aim = Math.atan2(mw.y - player.y, mw.x - player.x); firing = mouse.down; }
    else if (ml > 0.1) player.aim = Math.atan2(my, mx);
    if (keys[' ']) firing = true;
    if (firing && player.cd <= 0) { fireBolt(player, player.aim, 540, 1, 'bolt'); player.cd = pc === 'medecin' ? 0.34 : 0.26; }

    // soin du joueur médecin : équipier blessé tout proche, personne en vue
    player.healing = null;
    if (pc === 'medecin' && !playerExposed) {
      let bestA = null, bd = 40;
      for (const a of allies) {
        if (a.hp <= 0 || a.hp >= a.maxHp) continue;
        const d = Math.hypot(a.x - player.x, a.y - player.y);
        if (d < bd && !enemySees(a)) { bd = d; bestA = a; }
      }
      if (bestA) {
        player.healing = bestA; player.healT += dt;
        if (player.healT >= 1.1) { player.healT = 0; heal(bestA); }
      } else player.healT = 0;
    } else player.healT = 0;
  }

  // ---------- boucle de jeu ----------
  function update(dt) {
    time += dt;
    shakeT = Math.max(0, shakeT - dt);

    let mx = 0, my = 0;
    if (keys['z'] || keys['w'] || keys['arrowup']) my -= 1;
    if (keys['s'] || keys['arrowdown']) my += 1;
    if (keys['q'] || keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    const mv = stickVec(sticks.move, 6);
    if (mv) { mx += mv.x * mv.m; my += mv.y * mv.m; }
    const ml = Math.hypot(mx, my);
    if (ml > 1) { mx /= ml; my /= ml; }
    player.rollCd -= dt;
    if (player.wantRoll) {
      player.wantRoll = false;
      if (canRoll(player) && !player.roll && player.rollCd <= 0) startRoll(player, ml > 0.2 ? Math.atan2(my, mx) : player.aim, ROLL_DIST, ROLL_CD_PLAYER);
    }
    if (player.roll) advanceRoll(player, dt);
    else { player.x += mx * 175 * dt; player.y += my * 175 * dt; }
    for (const o of obstacles) pushOutRect(player, o);
    for (const t of turrets) pushOutCircle(player, t, t.r);
    for (const d of droids) if (d.hp > 0) pushOutCircle(player, d, d.r);
    clampInArena(player);
    player.inv -= dt;

    computeExposure();
    if (!player.roll) updatePlayerWeapon(dt, stickVec(sticks.aim, 10), ml, mx, my);

    // tourelles
    for (const t of turrets) {
      t.hit -= dt;
      if (t.hp <= 0) continue;
      const tgt = nearestVisibleHostile(t.x, t.y, enemyRange(t));
      if (tgt) { t.lkx = tgt.x; t.lky = tgt.y; t.suppShots = 0; }
      else if (t.tgt && t.aimT > 0.25) { t.suppShots = 3 + Math.floor(Math.random() * 3); t.suppX = t.lkx; t.suppY = t.lky; }
      if (tgt && tgt !== t.tgt) t.aimT = Math.min(t.aimT, 0.15);
      t.tgt = tgt; t.los = !!tgt;
      const suppressing = !tgt && t.suppShots > 0;
      let target, turn;
      if (tgt) { target = Math.atan2(tgt.y - t.y, tgt.x - t.x); turn = 2.6; t.aimT += dt; }
      else if (suppressing) { target = Math.atan2(t.suppY - t.y, t.suppX - t.x); turn = 3; t.aimT = Math.max(0, t.aimT - dt); }
      else { target = t.rest + Math.sin(time * 0.8 + t.x + t.y) * (t.side ? 0.6 : 0.9); turn = 1; t.aimT = Math.max(0, t.aimT - dt * 2); }
      const d = angDiff(t.ang, target);
      t.ang += Math.max(-turn * dt, Math.min(turn * dt, d));
      t.cd -= dt; t.bt -= dt;
      if (t.burst > 0) {
        if (t.bt <= 0) { enemyShot(t, 24, 320, suppressing ? 0.2 : 0.08); t.burst--; t.bt = 0.13; if (suppressing) t.suppShots--; }
      } else if (t.cd <= 0 && Math.abs(d) < 0.2) {
        // les tourelles murales balaient large mais tirent des rafales plus courtes
        if (tgt && t.aimT > (t.side ? 0.7 : 0.5) * DIFF.aimMul) { t.burst = t.side ? 2 : 3; t.bt = 0; t.cd = (1.3 + Math.random() * 0.5) * DIFF.cdMul * (t.side ? 1.4 : 1); }
        else if (suppressing) { t.burst = Math.min(2, t.suppShots); t.bt = 0; t.cd = 0.4 + Math.random() * 0.25; }
      }
    }

    // équipiers
    for (const a of allies) {
      if (a.hp <= 0) continue;
      updateAlly(a, dt);
      for (const o of obstacles) pushOutRect(a, o);
      for (const t of turrets) pushOutCircle(a, t, t.r);
      for (const d of droids) if (d.hp > 0) pushOutCircle(a, d, d.r);
      for (const b of allies) if (b !== a && b.hp > 0) pushOutCircle(a, b, b.r);
      pushOutCircle(a, player, player.r - 2);
      clampInArena(a);
    }

    // droïdes
    for (const d of droids) {
      if (d.hp <= 0) continue;
      updateDroid(d, dt);
      for (const o of obstacles) pushOutRect(d, o);
      for (const t of turrets) pushOutCircle(d, t, t.r);
      for (const e of droids) if (e !== d && e.hp > 0) pushOutCircle(d, e, e.r);
      for (const a of allies) if (a.hp > 0) pushOutCircle(d, a, a.r);
      pushOutCircle(d, player, player.r);
      clampInArena(d);
    }

    // projectiles
    for (let i = bolts.length - 1; i >= 0; i--) {
      const b = bolts[i];
      if (b.kind === 'rocket') {
        b.trail -= dt;
        if (b.trail <= 0) { addSmoke(b.x, b.y, 1, false); b.trail = 0.035; }
        const step = Math.hypot(b.vx, b.vy) * dt;
        if (Math.hypot(b.tx - b.x, b.ty - b.y) <= step) { explode(b.tx, b.ty, b.src, b.team); bolts.splice(i, 1); continue; }
        const nx = b.x + b.vx * dt, ny = b.y + b.vy * dt;
        let boom = nx < WALL || nx > W - WALL || ny < WALL || ny > H - WALL || obstacles.some(o => inRect(nx, ny, o));
        if (!boom) for (const e of (b.team === 'enemy' ? friends() : aliveEnemies())) if (Math.hypot(nx - e.x, ny - e.y) < e.r + 4) { boom = true; break; }
        if (boom) { explode(b.x, b.y, b.src, b.team); bolts.splice(i, 1); continue; }
        b.x = nx; b.y = ny;
        continue;
      }
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let dead = b.life <= 0 || b.x < WALL || b.x > W - WALL || b.y < WALL || b.y > H - WALL;
      if (!dead) for (const o of obstacles) if (inRect(b.x, b.y, o)) { dead = true; break; }
      if (dead) { burst(b.x, b.y, b.team === 'enemy' ? '#FF5A3C' : '#5AAEFF', 5, 90); bolts.splice(i, 1); continue; }
      const dir = Math.atan2(b.vy, b.vx);
      if (b.team === 'enemy') {
        for (const f of friends()) {
          if (f.inv <= 0 && !isDodging(f) && Math.hypot(b.x - f.x, b.y - f.y) < f.r + 3) { hitFriend(f, b.dmg || 1, dir); bolts.splice(i, 1); break; }
        }
      } else {
        let hit = false;
        for (const e of aliveEnemies()) {
          const dd = Math.hypot(b.x - e.x, b.y - e.y);
          if (dd < e.r + 3) {
            burst(b.x, b.y, b.kind === 'snipe' ? '#C9A8FF' : '#5AAEFF', b.kind === 'snipe' ? 10 : 6, 110);
            hitEnemy(e, b.dmg, dir, b.src);
            bolts.splice(i, 1); hit = true; break;
          }
          if (e.home && dd < 38) {
            b.warned = b.warned || new Set();
            if (!b.warned.has(e)) { b.warned.add(e); e.stress += 0.12; e.provoked = b.src; }
          }
        }
        if (hit) continue;
      }
    }

    updateAnim(player, dt);
    for (const a of allies) if (a.hp > 0) updateAnim(a, dt);
    for (const d of droids) if (d.hp > 0) updateAnim(d, dt);
    for (const t of turrets) if (t.hp > 0) updateAnim(t, dt);
    updateEffects(dt);
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.9; s.vy *= 0.9; s.life -= dt;
      if (s.life <= 0) sparks.splice(i, 1);
    }
    for (let i = flashes.length - 1; i >= 0; i--) { flashes[i].life -= dt; if (flashes[i].life <= 0) flashes.splice(i, 1); }
    for (let i = plusFx.length - 1; i >= 0; i--) { const p = plusFx[i]; p.y -= 22 * dt; p.life -= dt; if (p.life <= 0) plusFx.splice(i, 1); }

    if (gameOver) { end(false); return; }
    if (Math.hypot(player.x - BEACON.x, player.y - BEACON.y) < 24) { end(true); return; }
    updateHud();
    refreshSquad(false);
    updateWeaponsUi();
    updateRollUi();
  }

  let hudCache = '';
  function updateHud() {
    const alive = turrets.filter(t => t.hp > 0).length;
    const droidsAlive = droids.filter(d => d.hp > 0).length;
    let clsText = CLASSES[player.cls].name;
    if (player.cls === 'lourd') {
      if (player.weapon === 'pistol') clsText = 'Pistolet';
      else if (player.reloadT > 0) clsText = `Recharge ${player.reloadT.toFixed(1).replace('.', ',')} s`;
      else clsText = player.loaded ? 'Bazooka chargé' : 'Bazooka vide';
      clsText += ` · ${player.rocketsLeft} roq.`;
    }
    if (player.cls === 'sniper') clsText = !player.lock ? 'Touche un ennemi' : player.lock.t < 1 ? 'Verrouillage…' : 'Cible verrouillée';
    if (player.cls === 'medecin' && player.healing) clsText = 'Soin en cours';
    const key = `${player.hp}|${clsText}|${alive}|${droidsAlive}`;
    const tt = time.toFixed(1).replace('.', ',') + ' s';
    if (timerEl.textContent !== tt) timerEl.textContent = tt;
    if (key === hudCache) return;
    hudCache = key;
    let pips = '';
    for (let i = 0; i < player.maxHp; i++) pips += `<span class="pip${i < player.hp ? '' : ' off'}"></span>`;
    hpEl.innerHTML = pips;
    classEl.innerHTML = `<span class="dot" style="--c:${CLASSES[player.cls].color}"></span>${clsText}`;
    turretEl.textContent = 'Tourelles ' + alive;
    droidEl.textContent = 'Droïdes ' + droidsAlive;
  }


  // ---------- rendu ----------
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    cw = r.width; ch = r.height;
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  }
  addEventListener('resize', resize);

  // Tout ce qui ne bouge pas est dessiné une seule fois dans une image hors écran,
  // puis recopié à chaque image : on ne redessine plus la grille, les zones ni les obstacles.
  let floorCanvas = null, floorCtx = null, floorK = 0;
  // Obstacles dessinés en passes successives : les pièces d'un L ou d'un Z se fondent en une seule forme
  function paintObstacles(c, list, withShadow) {
    if (withShadow) { c.fillStyle = 'rgba(30, 55, 80, 0.16)'; for (const o of list) c.fillRect(o.x + 4, o.y + 6, o.w, o.h); }
    c.fillStyle = '#7F8E9B'; for (const o of list) c.fillRect(o.x, o.y, o.w, o.h);
    c.fillStyle = '#9FADB9'; for (const o of list) c.fillRect(o.x + 1.5, o.y + 1.5, o.w - 3, o.h - 3);
    c.fillStyle = '#BCC8D1'; for (const o of list) c.fillRect(o.x + 3.5, o.y + 3.5, o.w - 7, o.h - 8);
  }
  function paintScorch(c, sc) {
    const g = c.createRadialGradient(sc.x, sc.y, 0, sc.x, sc.y, sc.r);
    g.addColorStop(0, 'rgba(45, 40, 35, 0.45)'); g.addColorStop(1, 'rgba(45, 40, 35, 0)');
    c.fillStyle = g; c.beginPath(); c.arc(sc.x, sc.y, sc.r, 0, Math.PI * 2); c.fill();
  }
  function buildFloor() {
    const k = Math.min(2, Math.max(0.5, Math.round(scale * dpr * 4) / 4));
    if (floorCanvas && k === floorK) return;
    floorK = k;
    floorCanvas = document.createElement('canvas');
    floorCanvas.width = Math.ceil(W * k); floorCanvas.height = Math.ceil(H * k);
    const c = floorCtx = floorCanvas.getContext('2d');
    c.setTransform(k, 0, 0, k, 0, 0);
    c.fillStyle = '#7C8B98'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#E5EBEF'; c.fillRect(WALL, WALL, W - WALL * 2, H - WALL * 2);
    c.strokeStyle = '#D3DCE2'; c.lineWidth = 1;
    c.beginPath();
    for (let x = WALL + 40; x < W - WALL; x += 40) { c.moveTo(x, WALL); c.lineTo(x, H - WALL); }
    for (let y = WALL + 40; y < H - WALL; y += 40) { c.moveTo(WALL, y); c.lineTo(W - WALL, y); }
    c.stroke();
    const zy = START.y - 40;
    c.fillStyle = 'rgba(46, 110, 212, 0.08)'; c.fillRect(WALL, zy, W - WALL * 2, H - WALL - zy);
    c.fillStyle = 'rgba(46, 110, 212, 0.55)'; c.fillRect(WALL, zy, W - WALL * 2, 3);
    // lumières murales (sauf là où une tourelle est fixée au mur)
    c.fillStyle = '#BFD6F2';
    for (let y = 80; y < H; y += 120) {
      if (!levelTurrets.some(t => t[0] < W / 2 && Math.abs(Math.sin(t[2])) < 0.5 && Math.abs(t[1] - y - 15) < 50)) c.fillRect(3, y, 10, 30);
      if (!levelTurrets.some(t => t[0] > W / 2 && Math.abs(Math.sin(t[2])) < 0.5 && Math.abs(t[1] - y - 15) < 50)) c.fillRect(W - 13, y, 10, 30);
    }
    // socles des tourelles, et support pour celles fixées aux murs
    for (const [tx, ty, rest] of levelTurrets) {
      c.fillStyle = 'rgba(210, 63, 43, 0.1)'; c.beginPath(); c.arc(tx, ty, 30, 0, Math.PI * 2); c.fill();
      if (Math.abs(Math.sin(rest)) < 0.5) {
        c.fillStyle = '#4A555F';
        if (tx < W / 2) c.fillRect(0, ty - 11, tx, 22); else c.fillRect(tx, ty - 11, W - tx, 22);
      }
    }
    for (const sc of scorches) paintScorch(c, sc);
    paintObstacles(c, obstacles, true);
  }
  // Une brûlure est "cuite" dans le sol au moment de l'explosion ; les obstacles voisins sont repeints par-dessus
  function bakeScorch(sc) {
    scorches.push(sc);
    if (!floorCtx) return;
    paintScorch(floorCtx, sc);
    paintObstacles(floorCtx, obstacles.filter(o => o.x - 2 < sc.x + sc.r + 60 && o.x + o.w + 60 > sc.x - sc.r && o.y - 60 < sc.y + sc.r && o.y + o.h + 60 > sc.y - sc.r), false);
  }
  function drawArena() {
    buildFloor();
    const x0 = Math.max(0, camX - 20), y0 = Math.max(0, camY - 20);
    const x1 = Math.min(W, camX + viewW + 20), y1 = Math.min(H, camY + viewH + 20);
    if (x1 > x0 && y1 > y0) ctx.drawImage(floorCanvas, x0 * floorK, y0 * floorK, (x1 - x0) * floorK, (y1 - y0) * floorK, x0, y0, x1 - x0, y1 - y0);
  }
  function inView(x, y, m) { return x > camX - m && x < camX + viewW + m && y > camY - m && y < camY + viewH + m; }

  function drawBeacon() {
    const pulse = Math.sin(performance.now() / 300) * 3;
    ctx.save(); ctx.translate(BEACON.x, BEACON.y);
    ctx.strokeStyle = 'rgba(46, 110, 212, 0.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 24 + pulse, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(61, 139, 255, 0.25)';
    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(16, 0); ctx.lineTo(0, 20); ctx.lineTo(-16, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3D8BFF';
    ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(10, 0); ctx.lineTo(0, 13); ctx.lineTo(-10, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#DCEBFF';
    ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(4.5, 0); ctx.lineTo(0, 6); ctx.lineTo(-4.5, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawFloorFx() {
    for (const p of debris) {
      if (!inView(p.x, p.y, 20)) continue;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = 'rgba(30, 55, 80, 0.18)';
      ctx.fillRect(-p.w / 2 + 1.5, -p.h / 2 + 2, p.w, p.h);
      ctx.fillStyle = p.color;
      if (p.shape === 'ellipse') { ctx.beginPath(); ctx.ellipse(0, 0, p.w / 2, p.h / 2, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#4A3D2A'; ctx.beginPath(); ctx.arc(-p.w / 4, 0, 1.3, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
  }

  function drawSmoke() {
    for (const s of smokes) {
      if (!inView(s.x, s.y, s.r)) continue;
      const a = Math.max(0, s.life / s.max);
      ctx.fillStyle = s.dust ? `rgba(178, 170, 156, ${a * 0.4})` : `rgba(95, 102, 110, ${a * 0.32})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    for (const r of rings) {
      const a = Math.max(0, r.life / r.max);
      ctx.strokeStyle = `rgba(255, 190, 110, ${a})`; ctx.lineWidth = 3 * a + 1;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawWounded(a) {
    const k = Math.min(1, a.fallT / 0.45), e = 1 - Math.pow(1 - k, 3);
    // arme tombée
    const gx = a.x + Math.cos(a.gunDir) * 17 * e, gy = a.y + Math.sin(a.gunDir) * 17 * e;
    ctx.save(); ctx.translate(gx, gy); ctx.rotate(a.gunDir + 0.9);
    ctx.fillStyle = '#2A333B'; ctx.fillRect(-8, -2, 16, 4); ctx.fillRect(-3, 2, 3, 4);
    ctx.restore();
    // soldat au sol
    ctx.save(); ctx.translate(a.x, a.y);
    ctx.rotate(a.startAng + angDiff(a.startAng, a.fallAng) * e);
    ctx.globalAlpha = 0.55 + 0.45 * e;
    ctx.fillStyle = 'rgba(30, 55, 80, 0.2)';
    ctx.beginPath(); ctx.ellipse(-2, 4, 23 * (0.6 + 0.4 * e), 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#98A6B2'; ctx.lineWidth = 1.1;
    // jambes
    ctx.fillStyle = '#EEF1F4';
    ctx.fillRect(-23 * e - 1, -5.5, 13 * e + 2, 4.5); ctx.strokeRect(-23 * e - 1, -5.5, 13 * e + 2, 4.5);
    ctx.fillRect(-22 * e - 1, 1, 12 * e + 2, 4.5); ctx.strokeRect(-22 * e - 1, 1, 12 * e + 2, 4.5);
    ctx.fillStyle = '#2A333B'; ctx.fillRect(-23 * e - 3, -5.5, 3, 4.5); ctx.fillRect(-22 * e - 3, 1, 3, 4.5);
    // bras : un le long du corps, l'autre tendu
    const wave = Math.sin(performance.now() / 700 + a.i) * 0.06;
    ctx.fillStyle = '#EEF1F4';
    ctx.fillRect(-9, 7, 11, 3.5); ctx.strokeRect(-9, 7, 11, 3.5);
    ctx.save(); ctx.translate(2, -7); ctx.rotate(-0.9 * e + wave);
    ctx.fillRect(0, -1.8, 12, 3.6); ctx.strokeRect(0, -1.8, 12, 3.6); ctx.restore();
    // torse
    ctx.fillStyle = '#F3F6F8';
    ctx.beginPath(); ctx.ellipse(-2, 0, 9 + 2 * e, 8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = CLASSES[a.cls].color; ctx.fillRect(-5, -9, 6, 3); ctx.fillRect(-5, 6, 6, 3);
    // casque
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(9 + 2 * e, 0, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = CLASSES[a.cls].color; ctx.fillRect(4, -1.2, 7, 2.4);
    ctx.fillStyle = '#1B252E'; ctx.fillRect(13 + 2 * e, -3.5, 2.5, 7);
    ctx.restore();
    // indicateur "blessé"
    if (k >= 1) {
      const pul = 0.7 + 0.3 * Math.sin(performance.now() / 380 + a.i);
      ctx.globalAlpha = pul;
      ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(a.x, a.y - 26, 8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#D23F2B'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#D23F2B'; ctx.fillRect(a.x - 1.6, a.y - 31, 3.2, 10); ctx.fillRect(a.x - 5, a.y - 27.6, 10, 3.2);
      ctx.globalAlpha = 1;
    }
    ctx.globalAlpha = 1;
  }

  function drawOrders() {
    // postes assignés
    for (const a of allies) {
      if (a.hp <= 0 || !a.post) continue;
      const p = a.post;
      if (a.phase === 'move') {
        ctx.strokeStyle = 'rgba(217, 150, 43, 0.5)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 5]);
        ctx.beginPath(); ctx.moveTo(a.x, a.y);
        if (a.nav) for (const q of a.nav.pts) ctx.lineTo(q.x, q.y);
        else ctx.lineTo(p.x, p.y);
        ctx.stroke(); ctx.setLineDash([]);
      }
      ctx.strokeStyle = '#D9962B'; ctx.lineWidth = 2;
      ctx.strokeRect(p.x - 9, p.y - 9, 18, 18);
      ctx.fillStyle = '#D9962B'; ctx.font = '700 11px Oxanium, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(a.i + 1), p.x, p.y + 0.5);
      ctx.textBaseline = 'alphabetic';
    }
  }

  function drawTurrets() {
    for (const t of turrets) {
      if (t.hp > 0 && t.tgt && state === 'play') {
        const a = 0.12 + 0.5 * Math.min(1, t.aimT / 0.55);
        ctx.strokeStyle = `rgba(225, 55, 35, ${a})`; ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]);
        ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(t.tgt.x, t.tgt.y); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    for (const t of turrets) {
      if (!inView(t.x, t.y, 40)) continue;
      ctx.save(); ctx.translate(t.x, t.y);
      ctx.fillStyle = 'rgba(30, 55, 80, 0.2)'; ctx.beginPath(); ctx.arc(3, 5, 19, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = t.hp > 0 ? '#56636E' : '#3A424A';
      ctx.beginPath();
      for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2 + Math.PI / 8; ctx.lineTo(Math.cos(a) * 19, Math.sin(a) * 19); }
      ctx.closePath(); ctx.fill();
      if (t.hp <= 0) { ctx.fillStyle = '#23292E'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill(); ctx.restore(); continue; }
      ctx.rotate(t.ang);
      ctx.fillStyle = '#2E3841'; ctx.fillRect(4 - (t.recoil || 0) * 4, -4, 22, 8);
      ctx.fillStyle = t.hit > 0 ? '#FFFFFF' : '#707D88';
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
      if (t.tgt) { ctx.fillStyle = 'rgba(255, 59, 31, 0.35)'; ctx.beginPath(); ctx.arc(5, 0, 7, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#E3452C';
      ctx.beginPath(); ctx.arc(5, 0, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      for (let i = 0; i < t.maxHp; i++) {
        ctx.fillStyle = i < t.hp ? '#E3452C' : 'rgba(60, 70, 80, 0.25)';
        ctx.fillRect(t.x - t.maxHp * 4.25 + i * 8.5, t.y - 30, 7, 3);
      }
    }
  }

  function drawDroids() {
    for (const d of droids) {
      if (d.hp <= 0 || state !== 'play') continue;
      if (d.ecls === 'sniper' && d.state === 'attack' && d.tgt && d.aimT > 0.05) {
        // laser du tireur d'élite : de plus en plus net, il clignote juste avant le tir
        const k = Math.min(1, d.aimT / (1.3 * DIFF.aimMul));
        const m = muzzleOf(d);
        const blink = k > 0.8 && Math.floor(performance.now() / 70) % 2 === 0;
        ctx.strokeStyle = `rgba(255, 40, 80, ${blink ? 0.95 : 0.2 + 0.55 * k})`; ctx.lineWidth = k > 0.8 ? 2 : 1;
        ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(d.tgt.x, d.tgt.y); ctx.stroke();
        ctx.fillStyle = 'rgba(255, 40, 80, 0.8)'; ctx.beginPath(); ctx.arc(d.tgt.x, d.tgt.y, 2.5, 0, Math.PI * 2); ctx.fill();
      } else if (d.state === 'attack' && d.tgt && d.aimT > 0.15) {
        const a = 0.1 + 0.4 * Math.min(1, d.aimT / 0.65);
        ctx.strokeStyle = `rgba(230, 120, 30, ${a})`; ctx.lineWidth = 1.2; ctx.setLineDash([4, 6]);
        ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.tgt.x, d.tgt.y); ctx.stroke(); ctx.setLineDash([]);
      }
      if (d.rocketWarn) {
        // zone d'impact annoncée de la roquette
        const w = d.rocketWarn, k = Math.min(1, w.t / ENEMY_ROCKET_WARN), pulse = 0.5 + 0.5 * Math.sin(performance.now() / 60);
        ctx.fillStyle = `rgba(210, 40, 30, ${0.1 + 0.15 * k + 0.08 * pulse})`;
        ctx.beginPath(); ctx.arc(w.x, w.y, ENEMY_ROCKET_R, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#D2281E'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
        ctx.beginPath(); ctx.arc(w.x, w.y, ENEMY_ROCKET_R, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(w.x, w.y, ENEMY_ROCKET_R * 0.35, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke();
      }
    }
    for (const d of droids) {
      if (!inView(d.x, d.y, 40)) continue;
      ctx.save(); ctx.translate(d.x, d.y);
      if (d.hp <= 0) {
        // carcasse : torse effondré dans le sens du tir, tête arrachée (partie en débris)
        const k = Math.min(1, d.deadT / 0.25), P = DROID_PAL[d.ecls], big = d.ecls === 'lourd' ? 1.3 : 1;
        ctx.rotate(d.deathAng); ctx.scale(big, big);
        ctx.fillStyle = 'rgba(30, 55, 80, 0.18)';
        ctx.beginPath(); ctx.ellipse(6 * k + 2, 3, 12, 7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = P.line;
        ctx.fillRect(-9, -4.5, 9, 2.5); ctx.fillRect(-8, 2, 8, 2.5);            // jambes
        ctx.fillStyle = k < 0.5 ? '#FFF3DC' : P.dead; ctx.strokeStyle = P.line; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.ellipse(6 * k, 0, 11, 5.5, 0.2 * k, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#3B3226'; ctx.fillRect(6 * k + 9, -1.5, 5, 3);         // cou arraché
        ctx.fillStyle = '#2A241B'; ctx.beginPath(); ctx.arc(6 * k + 2, 0, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.restore(); continue;
      }
      ctx.fillStyle = 'rgba(30, 55, 80, 0.2)';
      ctx.beginPath(); ctx.ellipse(3, 5, 8, 12, d.ang, 0, Math.PI * 2); ctx.fill();
      drawFeet(d, d.ang, true);
      const dw = d.aWalk || 0, dph = d.aPhase || 0;
      ctx.rotate(d.ang + Math.sin(dph) * 0.12 * dw);   // démarche raide et chaloupée
      drawDroidBody(d);
      ctx.restore();
      // barre de vie continue (les lourds ont beaucoup de points)
      const bw = d.ecls === 'lourd' ? 34 : 26, by = d.y - d.r - 12;
      ctx.fillStyle = 'rgba(60, 70, 80, 0.3)'; ctx.fillRect(d.x - bw / 2, by, bw, 3.5);
      ctx.fillStyle = d.hp <= d.low ? '#E3452C' : '#C99A3A'; ctx.fillRect(d.x - bw / 2, by, bw * Math.max(0, d.hp) / d.maxHp, 3.5);
      if (d.state === 'repair') {
        ctx.fillStyle = '#F0A33A'; ctx.fillRect(d.x - 1.5, by - 12, 3, 9); ctx.fillRect(d.x - 4.5, by - 9, 9, 3);
      }
      if (d.state === 'attack') {
        ctx.fillStyle = '#E3452C'; ctx.font = '700 13px Oxanium, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('!', d.x, d.y - 26);
      } else if (d.state === 'cover') {
        ctx.fillStyle = '#4F7BB8';
        ctx.beginPath();
        ctx.moveTo(d.x - 5, d.y - 35); ctx.lineTo(d.x + 5, d.y - 35); ctx.lineTo(d.x + 5, d.y - 30);
        ctx.quadraticCurveTo(d.x + 5, d.y - 26, d.x, d.y - 24); ctx.quadraticCurveTo(d.x - 5, d.y - 26, d.x - 5, d.y - 30);
        ctx.closePath(); ctx.fill();
      }
    }
  }


  function drawHighlights() {
    if (selected < 0) return;
    const a = allies[selected];
    const now = performance.now();
    const pulse = 0.5 + 0.5 * Math.sin(now / 180);
    for (const p of highlight) {
      const mine = a.post === p || a.prevPost === p;
      ctx.fillStyle = `rgba(217, 150, 43, ${0.18 + pulse * 0.14})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = mine ? '#1C2934' : '#D9962B'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, 15 + pulse * 3, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(46, 110, 212, 0.8)'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.arc(player.x, player.y, 22 + pulse * 2, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#2E6ED4'; ctx.font = '700 11px Oxanium, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Suivre', player.x, player.y + 40);
    if (a.cls === 'medecin') {
      for (const h of healTargets(a)) {
        const x = h.x, y = h.y - 34;
        ctx.fillStyle = '#2EAD6B'; ctx.beginPath(); ctx.arc(x, y, 11 + pulse * 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x - 1.8, y - 6.5, 3.6, 13); ctx.fillRect(x - 6.5, y - 1.8, 13, 3.6);
      }
    }
    if (a.cls === 'sniper') {
      for (const e of aliveEnemies()) {
        ctx.strokeStyle = `rgba(142, 91, 214, ${0.5 + pulse * 0.4})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 7, 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.strokeStyle = 'rgba(217, 150, 43, 0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(a.x, a.y, 17, 0, Math.PI * 2); ctx.stroke();
  }

  // Lignes de verrouillage du sniper : clignotent pendant 1 s, puis vert (tir dégagé) ou rouge (bloqué)
  function drawLock(u, lock, width) {
    if (!lock || !lock.tgt || lock.tgt.hp <= 0 || u.hp <= 0) return;
    const t = lock.tgt, now = performance.now();
    let color, alpha = 0.9;
    if (lock.t < 1) { color = '#C9A8FF'; alpha = Math.floor(now / 110) % 2 ? 0.95 : 0.2; }
    else color = lockLineClear(u, t) ? '#3FCB6B' : '#E3452C';
    ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash([7, 5]);
    const mz = muzzleOf(u);
    ctx.beginPath(); ctx.moveTo(mz.x, mz.y); ctx.lineTo(t.x, t.y); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    const k = Math.min(1, lock.t);
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r + 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke();
    if (k >= 1) {
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + now / 600;
        ctx.beginPath(); ctx.moveTo(t.x + Math.cos(a) * (t.r + 5), t.y + Math.sin(a) * (t.r + 5));
        ctx.lineTo(t.x + Math.cos(a) * (t.r + 13), t.y + Math.sin(a) * (t.r + 13)); ctx.stroke();
      }
    }
  }

  function drawRocketZones() {
    const now = performance.now();
    if (player.cls === 'lourd' && player.heavyPreview && state === 'play') {
      const p = player.heavyPreview, ready = player.loaded;
      ctx.strokeStyle = 'rgba(210, 63, 43, 0.25)'; ctx.lineWidth = 1; ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.arc(player.x, player.y, ROCKET_RANGE, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.setLineDash([6, 5]);
      ctx.fillStyle = ready ? 'rgba(210, 63, 43, 0.16)' : 'rgba(100, 110, 120, 0.14)';
      ctx.strokeStyle = ready ? '#D23F2B' : '#7C8B98'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, ROCKET_R, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = ready ? '#D23F2B' : '#7C8B98';
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fill();
      if (!ready) {
        ctx.font = '700 12px Oxanium, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(player.reloadT > 0 ? player.reloadT.toFixed(1).replace('.', ',') + ' s' : 'Recharger', p.x, p.y - ROCKET_R - 6);
      }
    }
    for (const a of allies) {
      if (a.hp <= 0 || !a.rocketZone) continue;
      const p = a.rocketZone, pulse = 0.5 + 0.5 * Math.sin(now / 200);
      ctx.strokeStyle = a.rocketAuth ? '#D23F2B' : `rgba(224, 103, 43, ${0.5 + pulse * 0.5})`;
      ctx.fillStyle = `rgba(224, 103, 43, ${0.08 + pulse * 0.08})`;
      ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.arc(p.x, p.y, ROCKET_R, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  // Corps des droïdes selon leur classe (vue de dessus, x = vers l'avant)
  function drawDroidBody(d) {
    const P = DROID_PAL[d.ecls], hurt = d.hurt > 0, rc = (d.recoil || 0) * 2;
    ctx.lineWidth = 1.2;
    if (d.ecls === 'lourd') {
      // gros châssis gris, deux bras-canons
      const ra = d.arm > 0 ? rc : 0, la = d.arm < 0 ? rc : 0;   // le bras qui vient de tirer recule
      ctx.fillStyle = P.dark;
      ctx.fillRect(1 - la, 7.5, 17, 4.5); ctx.fillRect(1 - ra, -12, 17, 4.5);
      ctx.fillStyle = '#23272B'; ctx.fillRect(15 - la, 7.5, 3, 4.5); ctx.fillRect(15 - ra, -12, 3, 4.5);
      ctx.fillStyle = hurt ? '#FFFFFF' : P.body; ctx.strokeStyle = P.line;
      ctx.beginPath(); ctx.ellipse(-2, 0, 9, 13, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = hurt ? '#FFFFFF' : '#A3ABB3';
      ctx.beginPath(); ctx.ellipse(0, 0, 5.5, 8.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = P.head; ctx.beginPath(); ctx.ellipse(4, 0, 4, 4.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2F3338'; ctx.fillRect(6, -1, 2, 2);
      if (d.rockets > 0) { ctx.fillStyle = '#D2281E'; ctx.fillRect(-9, -3, 3, 6); }   // réserve de roquettes
    } else if (d.ecls === 'sniper') {
      // silhouette fine et sombre, long fusil, fente rouge
      ctx.fillStyle = P.dark; ctx.fillRect(2 - rc, 1.2, 27, 2.6); ctx.fillRect(8 - rc, 0, 4, 5);
      ctx.fillStyle = hurt ? '#FFFFFF' : P.body; ctx.strokeStyle = P.line;
      ctx.beginPath(); ctx.ellipse(-2, 0, 4.5, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = hurt ? '#FFFFFF' : P.head;
      ctx.beginPath(); ctx.ellipse(4, 0, 7.5, 2.8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#FF3B2F'; ctx.fillRect(8, -0.8, 3.5, 1.6);
    } else {
      ctx.fillStyle = P.dark; ctx.fillRect(3 - rc, 4, 15, 3.5);
      ctx.fillStyle = hurt ? '#FFFFFF' : P.body; ctx.strokeStyle = P.line;
      ctx.beginPath(); ctx.ellipse(-1, 0, 5.5, 11, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      if (d.ecls === 'medecin') { ctx.fillStyle = '#C8372D'; ctx.fillRect(-3, -10.5, 3, 21); }   // bande rouge
      ctx.fillStyle = hurt ? '#FFFFFF' : P.head;
      ctx.beginPath(); ctx.ellipse(5, 0, 8, 3.8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      if (d.ecls === 'medecin') { ctx.fillStyle = '#C8372D'; ctx.fillRect(6, -3.8, 2.5, 7.6); }
      ctx.fillStyle = '#4A3D2A'; ctx.beginPath(); ctx.arc(2, 0, 2, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Pieds qui alternent dans la direction de la marche (le buste, lui, regarde où l'on vise)
  function drawFeet(u, bodyAng, droid) {
    const w = u.aWalk || 0, ph = u.aPhase || 0;
    const md = bodyAng + angDiff(bodyAng, u.aDir === undefined ? bodyAng : u.aDir) * Math.min(1, w * 2);
    const c = Math.cos(md), sn = Math.sin(md), px = -sn, py = c;
    const sz = droid ? (u.r || 10) / 10 : 1;
    const spread = (droid ? 3.8 : 5) * sz, reach = (droid ? 9 : 12) * w * sz;
    for (const side of [1, -1]) {
      const f = Math.sin(ph) * reach * side;
      const lift = Math.max(0, Math.cos(ph) * side) * w;   // pied en l'air : un peu plus gros
      ctx.save();
      ctx.translate(px * spread * side + c * f, py * spread * side + sn * f);
      ctx.rotate(md);
      const k = (1 + 0.2 * lift) * sz; ctx.scale(k, k);
      if (droid) {
        ctx.fillStyle = DROID_PAL[u.ecls].foot; ctx.fillRect(-4.5, -1.4, 9, 2.8);
        ctx.fillStyle = DROID_PAL[u.ecls].line; ctx.fillRect(2.5, -1.8, 3, 3.6);
      } else {
        ctx.fillStyle = '#E8ECEF'; ctx.strokeStyle = '#98A6B2'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(0.5, 0, 4.8, 2.9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#2A333B'; ctx.fillRect(-4.3, -1.7, 1.9, 3.4);
      }
      ctx.restore();
    }
  }

  // Corps du soldat, avec balancement du buste, léger rebond et recul de l'arme
  function drawTrooperBody(u, ang, stripe, flash, scl, sway) {
    ctx.save();
    ctx.rotate(ang + sway);
    ctx.scale(scl, scl);
    const rc = (u.recoil || 0) * 2.2;
    ctx.fillStyle = '#2A333B';
    if (u.cls === 'lourd' && (u.isPlayer ? u.weapon === 'bazooka' : u.rocketsLeft > 0)) { ctx.fillRect(-6 - rc, 3, 26, 6.5); ctx.fillStyle = stripe; ctx.fillRect(16 - rc, 3, 4, 6.5); }
    else if (u.cls === 'lourd') ctx.fillRect(4 - rc, 5, 12, 4);
    else if (u.cls === 'sniper') ctx.fillRect(4 - rc, 5, 24, 3.5);
    else ctx.fillRect(4 - rc, 5, 17, 4.5);
    ctx.fillStyle = flash ? '#FFD2C8' : '#F3F6F8'; ctx.strokeStyle = '#98A6B2'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(-rc * 0.3, 0, 8, 14, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = stripe; ctx.fillRect(-4 - rc * 0.3, -13, 6, 3.5); ctx.fillRect(-4 - rc * 0.3, 9.5, 6, 3.5);
    ctx.rotate(-sway * 0.6);   // la tête compense le balancement des épaules
    ctx.fillStyle = flash ? '#FFD2C8' : '#FFFFFF';
    ctx.beginPath(); ctx.arc(1, 0, 7.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = stripe; ctx.fillRect(-5, -1.2, 8, 2.4);
    ctx.fillStyle = '#1B252E'; ctx.fillRect(5, -4, 3, 8);
    if (u.cls === 'medecin') { ctx.fillStyle = '#FFFFFF'; ctx.fillRect(-4.5, -2.8, 2, 5.6); ctx.fillStyle = stripe; ctx.fillRect(-4.2, -2.2, 1.4, 4.4); }
    ctx.restore();
  }

  function drawTrooper(u, ang, stripe, flash, isPlayer) {
    ctx.save(); ctx.translate(u.x, u.y);
    if (isPlayer) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.beginPath(); ctx.arc(0, 0, 19, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = stripe; ctx.lineWidth = 1.5; ctx.stroke();
    }
    const r = u.roll;
    if (r && r.t < ROLL_PREP) {
      // appel : il se ramasse et se tourne vers la direction de la roulade
      const k = r.t / ROLL_PREP;
      const a = r.from + angDiff(r.from, r.ang) * k;
      ctx.fillStyle = 'rgba(30, 55, 80, 0.2)';
      ctx.beginPath(); ctx.ellipse(3, 5, 10, 14, a, 0, Math.PI * 2); ctx.fill();
      drawTrooperBody(u, a, stripe, flash, 1 - 0.14 * k, 0);
    } else if (r && r.t < ROLL_MOVE) {
      // roulé : images fantômes, boule qui tourne, étirée dans l'axe au plus fort de la vitesse
      const k = (r.t - ROLL_PREP) / (ROLL_MOVE - ROLL_PREP);
      r.trail.forEach((g, i) => {
        ctx.fillStyle = `rgba(150, 165, 182, ${0.07 + i * 0.05})`;
        ctx.beginPath(); ctx.arc(g.x - u.x, g.y - u.y, 8 + i * 0.6, 0, Math.PI * 2); ctx.fill();
      });
      ctx.rotate(r.ang);
      ctx.fillStyle = 'rgba(30, 55, 80, 0.2)';
      ctx.beginPath(); ctx.ellipse(2, 4, 12, 9, 0, 0, Math.PI * 2); ctx.fill();
      const speedK = 1 - k;                       // vitesse relative (forte au début)
      ctx.scale(1 + 0.2 * speedK, 1 - 0.12 * speedK);
      ctx.rotate(rollEase(k) * Math.PI * 2);
      ctx.fillStyle = '#F3F6F8'; ctx.strokeStyle = '#98A6B2'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(0, 0, 10.5, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = stripe; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 6, 0.3, Math.PI - 0.3); ctx.stroke();
      ctx.fillStyle = '#2A333B'; ctx.fillRect(-7, -8.5, 10, 3);             // arme serrée contre le corps
      ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#98A6B2'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(5, -2, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#1B252E'; ctx.fillRect(7.5, -4.5, 2, 5);
    } else if (r) {
      // réception : il se relève et retrouve sa visée
      const k = (r.t - ROLL_MOVE) / (ROLL_DUR - ROLL_MOVE);
      const a = r.ang + angDiff(r.ang, ang) * k;
      ctx.fillStyle = 'rgba(30, 55, 80, 0.2)';
      ctx.beginPath(); ctx.ellipse(3, 5, 10, 14, a, 0, Math.PI * 2); ctx.fill();
      drawTrooperBody(u, a, stripe, flash, 0.86 + 0.14 * k, (1 - k) * 0.15);
    } else {
      const w = u.aWalk || 0, ph = u.aPhase || 0;
      ctx.fillStyle = 'rgba(30, 55, 80, 0.2)';
      ctx.beginPath(); ctx.ellipse(3, 5, 10, 15, ang, 0, Math.PI * 2); ctx.fill();
      drawFeet(u, ang, false);
      const bob = 1 + Math.abs(Math.sin(ph)) * 0.035 * w;
      drawTrooperBody(u, ang, stripe, flash, bob, Math.sin(ph) * 0.09 * w);
    }
    ctx.restore();
  }

  function drawAllies() {
    for (const a of allies) if (a.hp <= 0 && inView(a.x, a.y, 40)) drawWounded(a);
    for (const a of allies) {
      if (a.hp <= 0 || !inView(a.x, a.y, 40)) continue;
      drawTrooper(a, a.ang, CLASSES[a.cls].color, a.flash > 0, false);
      ctx.fillStyle = '#D9962B'; ctx.beginPath(); ctx.arc(a.x, a.y - 27, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFFFFF'; ctx.font = '700 10px Oxanium, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(a.i + 1), a.x, a.y - 26.5); ctx.textBaseline = 'alphabetic';
      for (let i = 0; i < a.maxHp; i++) {
        ctx.fillStyle = i < a.hp ? (a.hp / a.maxHp <= 0.4 ? '#E3452C' : '#3A9F66') : 'rgba(60, 70, 80, 0.25)';
        ctx.fillRect(a.x - 16 + i * 6.5, a.y - 19, 5, 3);
      }
      if (a.mode === 'heal' && a.healTarget && Math.hypot(a.healTarget.x - a.x, a.healTarget.y - a.y) < 42) {
        ctx.strokeStyle = 'rgba(46, 173, 107, 0.7)'; ctx.lineWidth = 2; ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.healTarget.x, a.healTarget.y); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  }

  function drawPlayer() {
    if (player.healing) {
      ctx.strokeStyle = 'rgba(46, 173, 107, 0.7)'; ctx.lineWidth = 2; ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(player.healing.x, player.healing.y); ctx.stroke(); ctx.setLineDash([]);
    }
    if (player.inv > 0 && Math.floor(player.inv * 20) % 2 === 0) return;
    drawTrooper(player, player.aim, CLASSES[player.cls].color, false, true);
  }

  // Projectiles regroupés par couleur : un seul tracé par groupe, halo simulé par un trait large translucide
  const BOLT_GROUPS = [
    { key: 'enemy', core: '#FF4A2E', glow: 'rgba(255, 74, 46, 0.28)', w: 3.5, tail: 0.035 },
    { key: 'esnipe', core: '#FF4F7B', glow: 'rgba(255, 60, 110, 0.32)', w: 2.5, tail: 0.03 },
    { key: 'bolt', core: '#4AA3FF', glow: 'rgba(74, 163, 255, 0.28)', w: 3.5, tail: 0.035 },
    { key: 'snipe', core: '#C9A8FF', glow: 'rgba(201, 168, 255, 0.32)', w: 2.5, tail: 0.03 }
  ];
  const boltGroup = b => b.team === 'enemy' ? (b.kind === 'esnipe' ? 'esnipe' : 'enemy') : b.kind === 'snipe' ? 'snipe' : 'bolt';
  function drawBolts() {
    for (const b of bolts) {
      if (b.kind !== 'rocket' || !inView(b.x, b.y, 30)) continue;
      const a = Math.atan2(b.vy, b.vx);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(a);
      ctx.fillStyle = 'rgba(255, 179, 71, 0.35)'; ctx.beginPath(); ctx.arc(-9, 0, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFB347'; ctx.beginPath(); ctx.moveTo(-6, -2.5); ctx.lineTo(-13 - Math.random() * 4, 0); ctx.lineTo(-6, 2.5); ctx.fill();
      ctx.fillStyle = '#3A424A'; ctx.fillRect(-6, -2.5, 11, 5);
      ctx.fillStyle = '#D23F2B'; ctx.fillRect(3, -2.5, 3, 5);
      ctx.restore();
    }
    ctx.lineCap = 'round';
    for (const g of BOLT_GROUPS) {
      ctx.beginPath();
      let any = false;
      for (const b of bolts) {
        if (b.kind === 'rocket' || boltGroup(b) !== g.key || !inView(b.x, b.y, 30)) continue;
        ctx.moveTo(b.x - b.vx * g.tail, b.y - b.vy * g.tail); ctx.lineTo(b.x, b.y); any = true;
      }
      if (!any) continue;
      ctx.strokeStyle = g.glow; ctx.lineWidth = g.w + 5; ctx.stroke();
      ctx.strokeStyle = g.core; ctx.lineWidth = g.w; ctx.stroke();
    }
    ctx.lineCap = 'butt';
    let lastColor = null;
    for (const sp of sparks) {
      if (!inView(sp.x, sp.y, 10)) continue;
      ctx.globalAlpha = Math.max(0, sp.life / sp.max);
      if (sp.color !== lastColor) { ctx.fillStyle = sp.color; lastColor = sp.color; }
      ctx.fillRect(sp.x - 1.5, sp.y - 1.5, 3, 3);
    }
    for (const f of flashes) {
      const a = Math.max(0, f.life / 0.07);
      ctx.globalAlpha = a * 0.45; ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x, f.y, 7, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(f.x, f.y, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(f.x, f.y, 1.8, 0, Math.PI * 2); ctx.fill();
    }
    for (const p of plusFx) {
      ctx.globalAlpha = Math.max(0, p.life / 0.9);
      ctx.fillStyle = p.color || '#2EAD6B';
      ctx.fillRect(p.x - 1.5, p.y - 5, 3, 10); ctx.fillRect(p.x - 5, p.y - 1.5, 10, 3);
    }
    ctx.globalAlpha = 1;
  }


  function drawStick(s, base, label) {
    ctx.fillStyle = 'rgba(28, 41, 52, 0.12)'; ctx.strokeStyle = 'rgba(28, 41, 52, 0.28)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(base.x, base.y, STICK_R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    let kx = base.x, ky = base.y;
    if (s) { const dx = s.x - s.ox, dy = s.y - s.oy, d = Math.hypot(dx, dy), m = Math.min(d, STICK_R); if (d > 0) { kx = base.x + dx / d * m; ky = base.y + dy / d * m; } }
    ctx.fillStyle = s ? 'rgba(46, 110, 212, 0.75)' : 'rgba(28, 41, 52, 0.25)';
    ctx.beginPath(); ctx.arc(kx, ky, 22, 0, Math.PI * 2); ctx.fill();
    if (!s) {
      ctx.fillStyle = 'rgba(28, 41, 52, 0.5)'; ctx.font = '600 11px Oxanium, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(label, base.x, base.y + STICK_R + 16);
    }
  }


  function render(dt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scale = Math.min(cw / 420, ch / 640);
    viewH = ch / scale; viewW = cw / scale;
    const ty = viewH >= H ? -(viewH - H) / 2 : Math.max(0, Math.min(H - viewH, player.y - viewH * 0.62));
    const tx = viewW >= W ? -(viewW - W) / 2 : Math.max(0, Math.min(W - viewW, player.x - viewW / 2));
    const k = Math.min(1, dt * 6);
    camY += (ty - camY) * k; camX += (tx - camX) * k;
    const sh = shakeT > 0 ? shakeT * 16 : 0;
    const sx = (Math.random() - 0.5) * sh, sy = (Math.random() - 0.5) * sh;

    ctx.fillStyle = '#7C8B98'; ctx.fillRect(0, 0, cw, ch);
    ctx.save();
    ctx.translate(-camX * scale + sx, -camY * scale + sy);
    ctx.scale(scale, scale);
    drawArena();
    drawFloorFx();
    drawBeacon();
    drawOrders();
    drawRocketZones();
    drawHighlights();
    drawTurrets();
    drawDroids();
    drawAllies();
    drawPlayer();
    if (state === 'play') {
      drawLock(player, player.lock, 2);
      for (const a of allies) if (a.cls === 'sniper') drawLock(a, a.lock, 1.3);
    }
    drawBolts();
    drawSmoke();
    ctx.restore();

    if (isTouch && state === 'play') {
      drawStick(sticks.move, baseL(), 'Déplacement');
      drawStick(sticks.aim, baseR(), player.cls === 'lourd' ? 'Viser, relâcher' : 'Viser et tirer');
    }
  }

  // ---------- écrans ----------
  function fmt(t) { return t.toFixed(1).replace('.', ',') + ' s'; }

  function controlsHtml() {
    return isTouch
      ? `<p>Joystick gauche : se déplacer</p>
         <p>Joystick droit : viser et tirer (Lourd au bazooka : la longueur du geste règle la distance, relâche pour tirer, reviens au centre pour annuler)</p>
         <p>Lourd : boutons « Recharger » (2,8 s) et changement d'arme au-dessus du joystick droit. 5 roquettes par partie</p>
         <p>Classique, médecin, sniper : bouton « Roulade » au-dessus du joystick droit, dans la direction où tu te déplaces</p>
         <p>Sniper : touche un ennemi à l'écran pour le verrouiller</p>
         <p>Bulle d'un équipier, puis un abri, une croix verte (médecin), un ennemi (sniper) ou ton soldat</p>
         <p>Bouton « Feu » près d'une bulle : autoriser la roquette d'un Lourd</p>`
      : `<p>ZQSD ou flèches : se déplacer</p>
         <p>Souris : viser, clic : tirer (Lourd : la souris place la zone d'impact)</p>
         <p>Sniper : clic sur un ennemi pour le verrouiller</p>
         <p>1, 2, 3 ou clic sur une bulle, puis clic sur un abri, une croix verte, un ennemi ou ton soldat</p>
         <p>F ou bouton « Feu » : autoriser la roquette d'un Lourd</p>
         <p>Lourd : R pour recharger (2,8 s), X pour changer d'arme. 5 roquettes par partie</p>
         <p>Classique, médecin, sniper : Maj ou C pour une roulade</p>`;
  }

  function enemySummary(diff, lv) {
    const n = {}, k0 = DIFF_INDEX[diff];
    for (const [, , spec] of lv.droids) { const k = CLASS_CODE[spec.split(' ')[k0]]; if (k) n[k] = (n[k] || 0) + 1; }
    const side = lv.turrets.filter(t => Math.abs(Math.sin(t[2])) < 0.5).length, front = lv.turrets.length - side;
    const tur = [front ? `${front} tourelle${front > 1 ? 's' : ''}` : '', side ? `${side} tourelle${side > 1 ? 's' : ''} latérale${side > 1 ? 's' : ''}` : ''].filter(Boolean);
    const lbl = { classique: ['droïde de combat', 'droïdes de combat'], lourd: ['droïde lourd', 'droïdes lourds'], medecin: ['réparateur', 'réparateurs'], sniper: ['tireur d\'élite', 'tireurs d\'élite'] };
    return Object.keys(lbl).filter(k => n[k]).map(k => `${n[k]} ${lbl[k][n[k] > 1 ? 1 : 0]}`).concat(tur).join(', ');
  }
  // Mini-carte d'un niveau (menu et générateur)
  const PV_COLORS = { classique: '#C9B184', lourd: '#6E767E', medecin: '#E8862E', sniper: '#8E5BD6' };
  function drawLevelPreview(cv, lv, diff) {
    const maxW = 118, maxH = 250;
    const k = Math.min(maxW / lv.W, maxH / lv.H);
    const w = Math.round(lv.W * k), h = Math.round(lv.H * k), r = Math.min(2, window.devicePixelRatio || 1);
    cv.width = w * r; cv.height = h * r; cv.style.width = w + 'px'; cv.style.height = h + 'px';
    const c = cv.getContext('2d');
    c.setTransform(r * k, 0, 0, r * k, 0, 0);
    c.fillStyle = '#7C8B98'; c.fillRect(0, 0, lv.W, lv.H);
    c.fillStyle = '#E5EBEF'; c.fillRect(WALL, WALL, lv.W - WALL * 2, lv.H - WALL * 2);
    c.fillStyle = 'rgba(46, 110, 212, 0.2)'; c.fillRect(WALL, lv.start.y - 40, lv.W - WALL * 2, lv.H - WALL - lv.start.y + 40);
    c.fillStyle = '#8795A2'; for (const [x, y, ww, hh] of lv.obstacles) c.fillRect(x, y, ww, hh);
    c.fillStyle = '#3D8BFF'; c.beginPath(); c.arc(lv.beacon.x, lv.beacon.y, 22, 0, Math.PI * 2); c.fill();
    for (const [tx, ty, rest] of lv.turrets) {
      c.fillStyle = '#D23F2B'; c.beginPath(); c.arc(tx, ty, 16, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#D23F2B'; c.lineWidth = 8; c.beginPath(); c.moveTo(tx, ty); c.lineTo(tx + Math.cos(rest) * 34, ty + Math.sin(rest) * 34); c.stroke();
    }
    const k0 = DIFF_INDEX[diff];
    for (const [x, y, spec] of lv.droids) {
      const cl = CLASS_CODE[spec.split(' ')[k0]];
      if (!cl) continue;
      c.fillStyle = PV_COLORS[cl]; c.beginPath(); c.arc(x, y, cl === 'lourd' ? 17 : 13, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#1C2934'; c.lineWidth = 3; c.stroke();
    }
    c.fillStyle = '#FFFFFF'; c.strokeStyle = '#2E6ED4'; c.lineWidth = 5;
    c.beginPath(); c.arc(lv.start.x, lv.start.y, 13, 0, Math.PI * 2); c.fill(); c.stroke();
  }
  const legendHtml = () => `<div class="legend"><span><i style="background:#D23F2B"></i>Tourelle</span><span><i style="background:${PV_COLORS.classique}"></i>Combat</span><span><i style="background:${PV_COLORS.lourd}"></i>Lourd</span><span><i style="background:${PV_COLORS.medecin}"></i>Réparateur</span><span><i style="background:${PV_COLORS.sniper}"></i>Tireur</span></div>`;
  const esc = t => String(t).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const droidCount = (lv, diff) => lv.droids.filter(d => d[2].split(' ')[DIFF_INDEX[diff]] !== '-').length;

  function optionsHtml() {
    return `<div class="opt"><span>Son</span><button class="toggle ${Sound.muted ? '' : 'on'}" id="sndToggle" aria-pressed="${!Sound.muted}">${Sound.muted ? 'Coupé' : 'Activé'}</button></div>
      <div class="opt"><label for="volRange">Volume</label><input type="range" id="volRange" min="0" max="100" value="${Math.round(Sound.volume * 100)}"></div>`;
  }
  function wireOptions() {
    const t = document.getElementById('sndToggle'), v = document.getElementById('volRange');
    if (t) t.onclick = () => { Sound.init(); Sound.setMuted(!Sound.muted); t.classList.toggle('on', !Sound.muted); t.textContent = Sound.muted ? 'Coupé' : 'Activé'; t.setAttribute('aria-pressed', String(!Sound.muted)); };
    if (v) { v.oninput = () => Sound.setVolume(v.value / 100); v.onchange = () => { Sound.init(); Sound.play('click'); }; }
  }

  let deleteArmed = null;
  function showMenu() {
    state = 'menu';
    const keep = card.scrollTop;
    const lv = levelById(cfg.level);
    cfg.level = lv.id;
    const bestT = getBest(cfg.diff);
    card.innerHTML = `
      <h1>Arène d'entraînement</h1>
      <p>Atteins la balise au fond de l'arène avec ton escouade.</p>
      ${STAGE >= 2 ? `<h2>Niveau</h2>
      <div class="levels" role="radiogroup" aria-label="Niveau">
        ${allLevels().map(l => `<div style="position:relative"><button role="radio" aria-checked="${l.id === lv.id}" class="lvl ${l.id === lv.id ? 'on' : ''}" data-level="${esc(l.id)}" style="width:100%">
            <b>${esc(l.name)}</b><small>${droidCount(l, cfg.diff)} droïdes · ${l.turrets.length} tourelles</small>${l.custom ? '<span class="tag">Perso</span>' : ''}</button>
            ${l.custom ? `<button class="lvl-del ${deleteArmed === l.id ? 'confirm' : ''}" data-del="${esc(l.id)}" aria-label="Supprimer ${esc(l.name)}">${deleteArmed === l.id ? 'Supprimer ?' : '×'}</button>` : ''}</div>`).join('')}
      </div>
      <div class="pv"><canvas id="pvCanvas" aria-label="Plan du niveau ${esc(lv.name)}"></canvas>
        <div><p class="small">${esc(lv.desc || 'Niveau généré.')}</p><p class="small">Ennemis : ${enemySummary(cfg.diff, lv)}.</p>${legendHtml()}</div></div>
      ${STAGE >= 3 ? '<button class="go ghost" id="genBtn">Créer un niveau procédural</button>' : ''}` : ''}
      <h2>Difficulté</h2>
      <div class="seg" role="radiogroup" aria-label="Difficulté">
        ${Object.entries(DIFFS).map(([k, v]) => `<button role="radio" aria-checked="${cfg.diff === k}" data-diff="${k}" class="${cfg.diff === k ? 'on' : ''}">${v.label}</button>`).join('')}
      </div>
      <p class="small">${DIFFS[cfg.diff].desc}</p>
      <h2>Ta classe</h2>
      <div class="classes" role="radiogroup" aria-label="Ta classe">
        ${CLASS_KEYS.map(k => { const c = CLASSES[k]; return `<button role="radio" aria-checked="${cfg.player === k}" data-cls="${k}" class="cls ${cfg.player === k ? 'on' : ''}" style="--c:${c.color}"><b><span class="dot"></span>${c.name}</b><small>${c.desc}</small></button>`; }).join('')}
      </div>
      <h2>Escouade</h2>
      <div class="stepper">
        <button id="minus" aria-label="Retirer un équipier" ${cfg.count <= 0 ? 'disabled' : ''}>−</button>
        <span>${cfg.count === 0 ? 'Seul' : cfg.count + ' équipier' + (cfg.count > 1 ? 's' : '')}</span>
        <button id="plus" aria-label="Ajouter un équipier" ${cfg.count >= 3 ? 'disabled' : ''}>+</button>
      </div>
      <div>
        ${[...Array(cfg.count).keys()].map(i => `
          <div class="srow">
            <div><b>${ALLY_NAMES[i]}</b><small>${CLASSES[cfg.squad[i]].name}</small></div>
            <div class="chips" role="radiogroup" aria-label="Classe de ${ALLY_NAMES[i]}">
              ${CLASS_KEYS.map(k => `<button role="radio" aria-checked="${cfg.squad[i] === k}" class="chipc ${cfg.squad[i] === k ? 'on' : ''}" style="--c:${CLASSES[k].color}" data-slot="${i}" data-k="${k}" aria-label="${CLASSES[k].name}" title="${CLASSES[k].name}"></button>`).join('')}
            </div>
          </div>`).join('')}
      </div>
      <details><summary>Options</summary>${optionsHtml()}</details>
      <details><summary>Commandes</summary><div class="controls">${controlsHtml()}</div></details>
      ${bestT ? `<p class="small">Meilleur temps sur ${esc(lv.name)} en ${DIFFS[cfg.diff].label} : ${fmt(bestT)}</p>` : ''}
      <button class="go" id="go">Commencer</button>`;
    card.scrollTop = keep;
    if (STAGE >= 2) drawLevelPreview(document.getElementById('pvCanvas'), lv, cfg.diff);
    card.querySelectorAll('[data-level]').forEach(b => b.onclick = () => { cfg.level = b.dataset.level; deleteArmed = null; saveCfg(); showMenu(); });
    card.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      const id = b.dataset.del;
      if (deleteArmed !== id) { deleteArmed = id; showMenu(); return; }   // deuxième appui : suppression
      customLevels = customLevels.filter(l => l.id !== id); saveLevels();
      deleteArmed = null; if (cfg.level === id) cfg.level = LEVELS[0].id; saveCfg(); showMenu();
    });
    if (STAGE >= 3) document.getElementById('genBtn').onclick = () => showGenerator(true);
    card.querySelectorAll('[data-diff]').forEach(b => b.onclick = () => { cfg.diff = b.dataset.diff; saveCfg(); showMenu(); });
    card.querySelectorAll('[data-cls]').forEach(b => b.onclick = () => { cfg.player = b.dataset.cls; saveCfg(); showMenu(); });
    card.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => { cfg.squad[+b.dataset.slot] = b.dataset.k; saveCfg(); showMenu(); });
    const minus = document.getElementById('minus'), plus = document.getElementById('plus');
    minus.onclick = () => { if (cfg.count > 0) { cfg.count--; saveCfg(); showMenu(); } };
    plus.onclick = () => { if (cfg.count < 3) { cfg.count++; saveCfg(); showMenu(); } };
    wireOptions();
    document.getElementById('go').onclick = start;
    overlay.classList.remove('hidden');
    hud.classList.add('hidden'); squadEl.classList.add('hidden'); hintEl.classList.add('hidden'); toastEl.classList.add('hidden'); weaponsEl.classList.add('hidden'); rollBtn.classList.add('hidden');
  }

  // ---------- générateur de niveaux ----------
  let genParams = { classique: 5, lourd: 1, medecin: 1, sniper: 1, front: 3, side: 2, seed: 1 };
  try { const g = JSON.parse(localStorage.getItem('arene-gen') || 'null'); if (g) for (const k in GEN_LIMITS) if (Number.isFinite(g[k])) genParams[k] = Math.max(GEN_LIMITS[k][0], Math.min(GEN_LIMITS[k][1], g[k] | 0)); } catch (e) {}
  let genLevel = null, genName = '';
  const GEN_ROWS = [['classique', 'Droïdes de combat'], ['lourd', 'Droïdes lourds'], ['medecin', 'Réparateurs'], ['sniper', 'Tireurs d\'élite'], ['front', 'Tourelles frontales'], ['side', 'Tourelles latérales']];
  function regenerate(newSeed) {
    if (newSeed) genParams.seed = (Math.random() * 1e9) | 0;
    try { localStorage.setItem('arene-gen', JSON.stringify(genParams)); } catch (e) {}
    genLevel = generateLevel(genParams);
  }
  function showGenerator(fresh) {
    state = 'menu';
    if (fresh || !genLevel) regenerate(fresh);
    const keep = card.scrollTop;
    const total = genParams.classique + genParams.lourd + genParams.medecin + genParams.sniper;
    card.innerHTML = `
      <h1>Niveau procédural</h1>
      <p>Choisis les ennemis : le plan se régénère à chaque réglage. « Nouveau plan » tire une autre disposition avec les mêmes ennemis.</p>
      <h2>Ennemis</h2>
      ${GEN_ROWS.map(([k, label]) => `<div class="grow"><span>${label}</span><div class="stepper">
          <button data-gk="${k}" data-d="-1" aria-label="Moins de ${label}" ${genParams[k] <= GEN_LIMITS[k][0] ? 'disabled' : ''}>−</button>
          <span>${genParams[k]}</span>
          <button data-gk="${k}" data-d="1" aria-label="Plus de ${label}" ${genParams[k] >= GEN_LIMITS[k][1] ? 'disabled' : ''}>+</button></div></div>`).join('')}
      ${total === 0 ? '<p class="small">Ajoute au moins un droïde.</p>' : ''}
      <button class="go ghost" id="reroll">Nouveau plan</button>
      ${genLevel ? `<div class="pv"><canvas id="pvCanvas" aria-label="Plan généré"></canvas>
        <div><p class="small">Arène de ${genLevel.W} × ${genLevel.H}, ${genLevel.obstacles.length} blocs d'obstacles.</p>
        <p class="small">Chaque tourelle latérale a un abri en L de son côté.</p><p class="small">Plan n° ${genParams.seed}</p>${legendHtml()}</div></div>`
        : '<p class="small">Impossible de placer tous ces ennemis. Réduis leur nombre ou essaie un nouveau plan.</p>'}
      <label class="field" for="lvlName">Nom du niveau<input type="text" id="lvlName" maxlength="30" placeholder="Mon niveau" value="${esc(genName)}" autocomplete="off"></label>
      <button class="go" id="saveLvl" ${genLevel && total ? '' : 'disabled'}>Enregistrer et sélectionner</button>
      <button class="go ghost" id="tryLvl" ${genLevel && total ? '' : 'disabled'}>Essayer sans enregistrer</button>
      <button class="go ghost" id="backMenu">Retour</button>`;
    card.scrollTop = keep;
    if (genLevel) drawLevelPreview(document.getElementById('pvCanvas'), genLevel, 'soldat');
    const nameInput = document.getElementById('lvlName');
    nameInput.oninput = () => { genName = nameInput.value; };
    card.querySelectorAll('[data-gk]').forEach(b => b.onclick = () => {
      const k = b.dataset.gk; genParams[k] = Math.max(GEN_LIMITS[k][0], Math.min(GEN_LIMITS[k][1], genParams[k] + +b.dataset.d));
      regenerate(false); showGenerator(false);
    });
    document.getElementById('reroll').onclick = () => { regenerate(true); showGenerator(false); };
    document.getElementById('backMenu').onclick = () => showMenu();
    const finish = save => {
      const name = (genName || '').trim() || `Niveau perso ${customLevels.length + 1}`;
      const lv = Object.assign({}, genLevel, { id: (save ? 'perso-' : 'essai-') + Date.now(), name, custom: true, desc: `Niveau généré (plan n° ${genParams.seed}).` });
      if (save) { customLevels.push(lv); saveLevels(); cfg.level = lv.id; saveCfg(); genName = ''; showMenu(); }
      else { tempLevel = lv; cfg.level = lv.id; start(); }
    };
    document.getElementById('saveLvl').onclick = () => finish(true);
    document.getElementById('tryLvl').onclick = () => finish(false);
  }
  let tempLevel = null;

  // ---------- pause ----------
  function showPause() {
    if (state !== 'play') return;
    state = 'paused';
    setSelected(-1);
    sticks.move = sticks.aim = null; mouse.down = false;
    for (const k in keys) keys[k] = false;
    card.innerHTML = `
      <h1>Pause</h1>
      <p>${esc(LEVEL.name)} · ${DIFF.label} · ${fmt(time)}</p>
      <button class="go" id="resumeBtn">Reprendre</button>
      <h2>Options</h2>
      ${optionsHtml()}
      <button class="go ghost" id="restartBtn">Recommencer le niveau</button>
      <button class="go ghost" id="quitBtn">Retour au menu</button>`;
    card.scrollTop = 0;
    wireOptions();
    document.getElementById('resumeBtn').onclick = resumeGame;
    document.getElementById('restartBtn').onclick = start;
    document.getElementById('quitBtn').onclick = () => { if (cfg.level.startsWith('essai-')) cfg.level = LEVELS[0].id; showMenu(); };
    overlay.classList.remove('hidden');
    squadEl.classList.add('hidden'); weaponsEl.classList.add('hidden'); rollBtn.classList.add('hidden');
  }
  function resumeGame() {
    if (state !== 'paused') return;
    state = 'play';
    overlay.classList.add('hidden');
    squadEl.classList.toggle('hidden', allies.length === 0);
    weaponsCache = ''; updateWeaponsUi(); rollUiCache = ''; updateRollUi();
    Sound.play('click');
  }

  function start() {
    Sound.init(); Sound.play('click');
    reset();
    state = 'play';
    card.scrollTop = 0;
    overlay.classList.add('hidden');
    hud.classList.remove('hidden');
    squadEl.classList.toggle('hidden', allies.length === 0);
    weaponsCache = ''; updateWeaponsUi();
    rollUiCache = ''; updateRollUi();
    sticks.move = sticks.aim = null; mouse.down = false;
  }

  function end(won) {
    Sound.play(won ? 'victory' : 'defeat');
    state = won ? 'won' : 'lost';
    setSelected(-1);
    toastEl.classList.add('hidden');
    const destroyed = turrets.filter(t => t.hp <= 0).length;
    const droidsDown = droids.filter(d => d.hp <= 0).length;
    const up = allies.filter(a => a.hp > 0).length, n = allies.length;
    let record = false;
    const prev = getBest(cfg.diff);
    if (won && (prev === null || time < prev)) { setBest(cfg.diff, time); record = true; }
    const squadLine = n ? `<p>Équipiers encore debout : ${up} sur ${n}${up < n ? ` (${n - up} blessé${n - up > 1 ? 's' : ''})` : ''}</p>` : '';
    card.innerHTML = (won
      ? `<h1>Balise atteinte</h1>
         <p class="stats">Temps : ${fmt(time)}${record ? ' (nouveau record)' : ''}</p>
         <p>Difficulté : ${DIFF.label} · Classe : ${CLASSES[player.cls].name}</p>
         <p>Tourelles détruites : ${destroyed} sur ${turrets.length} · Droïdes détruits : ${droidsDown} sur ${droids.length}</p>
         ${squadLine}
         ${prev && !record ? `<p>Meilleur temps : ${fmt(prev)}</p>` : ''}`
      : `<h1>Touché</h1>
         <p>Tu as tenu ${fmt(time)}, détruit ${destroyed} tourelle${destroyed > 1 ? 's' : ''} et ${droidsDown} droïde${droidsDown > 1 ? 's' : ''}.</p>
         ${squadLine}
         <p>Envoie un équipier sur l'abri suivant avant d'avancer : il te couvrira pendant que tu traverses.</p>`)
      + `<button class="go" id="go">${won ? 'Rejouer' : 'Recommencer'}</button>
         <button class="go ghost" id="menuBtn">Menu</button>`;
    document.getElementById('go').onclick = start;
    document.getElementById('menuBtn').onclick = () => { if (cfg.level.startsWith('essai-')) cfg.level = LEVELS[0].id; showMenu(); };
    overlay.classList.remove('hidden');
    squadEl.classList.add('hidden'); weaponsEl.classList.add('hidden'); rollBtn.classList.add('hidden');
    sticks.move = sticks.aim = null; mouse.down = false;
  }

  let last = performance.now();
  function loop(now) {
    const raw = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (state === 'play') {
      computeHighlight();
      update(selected >= 0 ? raw * 0.35 : raw);
    }
    render(raw);
    requestAnimationFrame(loop);
  }

  resize();
  reset();
  showMenu();
  requestAnimationFrame(loop);
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .catch(err => console.warn('Service worker registration failed:', err));
  });
}
</script>

</body>
</html>
