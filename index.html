<style>
  :root {
    --bg: #C9D3DA; --panel: rgba(244, 247, 249, 0.95); --ink: #1C2934; --muted: #536472;
    --accent: #2E6ED4; --ally: #D9962B; --danger: #D23F2B; --ok: #3A9F66; --soft: rgba(100, 115, 130, 0.14);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17212A; --panel: rgba(25, 35, 44, 0.96); --ink: #E4ECF1; --muted: #97A7B4;
      --accent: #5E9BFF; --ally: #F0B24A; --danger: #FF6250; --ok: #5CC98B; --soft: rgba(150, 170, 190, 0.14);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17212A; --panel: rgba(25, 35, 44, 0.96); --ink: #E4ECF1; --muted: #97A7B4;
    --accent: #5E9BFF; --ally: #F0B24A; --danger: #FF6250; --ok: #5CC98B; --soft: rgba(150, 170, 190, 0.14);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Oxanium', 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #app { position: relative; height: 100%; width: 100%; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }

  #hud {
    position: absolute; top: 8px; left: 8px; right: 8px;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px;
    pointer-events: none;
  }
  .chip {
    background: var(--panel); border-radius: 10px; padding: 5px 9px;
    font-weight: 600; font-size: 13px; display: flex; gap: 5px; align-items: center;
    box-shadow: 0 2px 8px rgba(20, 40, 60, 0.15);
  }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .chip.pausebtn { pointer-events: auto; border: 0; color: var(--ink); cursor: pointer; font-size: 14px; font-weight: 700; letter-spacing: 1px; min-width: 40px; justify-content: center; }
  .levels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .lvl { position: relative; text-align: left; padding: 9px 10px; border-radius: 12px; border: 2px solid transparent; background: var(--soft); color: var(--ink); }
  .lvl.on { border-color: var(--accent); background: rgba(46, 110, 212, 0.12); }
  .lvl b { display: block; font-size: 14px; padding-right: 18px; }
  .lvl small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  .lvl .tag { display: inline-block; font-size: 10px; font-weight: 700; color: #fff; background: var(--ally); border-radius: 6px; padding: 0 5px; margin-top: 4px; }
  .lvl-del { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; }
  .lvl-del.confirm { width: auto; border-radius: 8px; padding: 0 7px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; }
  .pv { display: flex; gap: 12px; align-items: flex-start; margin-top: 10px; }
  .pv canvas { position: static; flex: none; border-radius: 8px; background: #7C8B98; }
  .pv p { margin: 0 0 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .grow { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--soft); font-size: 14px; }
  .grow:first-of-type { border-top: 0; }
  .grow .stepper { gap: 8px; }
  .grow .stepper span { min-width: 28px; }
  .grow .stepper button { width: 32px; height: 32px; font-size: 18px; }
  .field { display: block; margin-top: 12px; font-size: 13px; font-weight: 700; }
  .field input[type="text"] {
    display: block; width: 100%; margin-top: 6px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--soft);
    background: var(--panel); color: var(--ink); font: inherit; font-size: 15px; user-select: text; -webkit-user-select: text; touch-action: auto;
  }
  .field input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 14px; font-weight: 600; }
  .opt input[type="range"] { flex: 1; max-width: 200px; accent-color: var(--accent); touch-action: auto; }
  .toggle { border: 0; border-radius: 16px; padding: 7px 14px; font-weight: 700; font-size: 13px; background: var(--soft); color: var(--ink); min-width: 90px; }
  .toggle.on { background: var(--accent); color: #fff; }
  .go:disabled { opacity: 0.45; cursor: default; }
  .pip { width: 8px; height: 13px; border-radius: 2px; background: var(--danger); }
  .pip.off { opacity: 0.18; }

  #squad {
    position: absolute; right: 8px; top: 44%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
  }
  .slot { position: relative; }
  .bubble {
    width: 60px; margin: 0; padding: 0; background: none; border: 0; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 3px; opacity: 0.94;
  }
  .ring {
    position: relative; width: 50px; height: 50px; border-radius: 50%;
    background: conic-gradient(var(--hpc, #3A9F66) calc(var(--hp, 100) * 1%), rgba(100, 115, 130, 0.3) 0);
    display: grid; place-items: center; box-shadow: 0 2px 8px rgba(20, 40, 60, 0.28);
    transition: transform 0.12s ease;
  }
  .core {
    width: 40px; height: 40px; border-radius: 50%; background: var(--panel);
    display: grid; place-items: center; font-weight: 700; font-size: 17px;
    color: var(--cc); box-shadow: inset 0 0 0 3px var(--cc);
  }
  .bubble.sel .ring { transform: scale(1.1); box-shadow: 0 0 0 3px var(--ally), 0 2px 10px rgba(20, 40, 60, 0.3); }
  .bubble.dead { opacity: 0.6; }
  .st {
    position: absolute; right: -4px; bottom: -3px; width: 21px; height: 21px; border-radius: 50%;
    display: grid; place-items: center; border: 2px solid var(--panel);
  }
  .st svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .bname { font-size: 10px; font-weight: 600; background: var(--panel); padding: 1px 6px; border-radius: 6px; white-space: nowrap; }
  .fire {
    position: absolute; right: calc(100% + 6px); top: 9px;
    background: #D23F2B; color: #fff; border: 0; border-radius: 14px; padding: 8px 11px;
    font-weight: 700; font-size: 12px; white-space: nowrap;
    box-shadow: 0 2px 10px rgba(210, 63, 43, 0.45); animation: pulse 0.9s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .ammo {
    position: absolute; left: -5px; top: -4px; min-width: 19px; height: 19px; padding: 0 4px; border-radius: 10px;
    background: #D23F2B; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center;
    border: 2px solid var(--panel);
  }
  .ammo.empty { background: #7C8B98; }
  #weapons {
    position: absolute; right: 12px; bottom: 214px;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  }
  .wbtn {
    position: relative; overflow: hidden; min-width: 118px; text-align: center;
    background: var(--panel); color: var(--ink); border: 2px solid #D23F2B; border-radius: 14px;
    padding: 9px 12px; font-weight: 700; font-size: 13px; box-shadow: 0 2px 10px rgba(20, 40, 60, 0.2);
  }
  .wbtn:disabled { opacity: 0.45; cursor: default; }
  .wbtn .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(210, 63, 43, 0.28); }
  .wbtn .lbl { position: relative; }
  .rollbtn {
    position: absolute; right: 16px; bottom: 214px; width: 66px; height: 66px; border-radius: 50%;
    border: 2px solid var(--c, #3AA55A); color: var(--ink); padding: 0;
    background: conic-gradient(rgba(100, 115, 130, 0.45) calc(var(--cd, 0) * 1%), var(--panel) 0);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font-size: 10px; font-weight: 700; box-shadow: 0 2px 10px rgba(20, 40, 60, 0.22);
  }
  .rollbtn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .rollbtn.cool { opacity: 0.7; }
  .wbtn.urgent { background: #D23F2B; color: #fff; animation: pulse 0.9s ease-in-out infinite; }

  #hint, #toast {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: max-content; max-width: min(80%, 420px);
    background: var(--panel); border-radius: 10px; padding: 8px 12px;
    font-size: 13px; line-height: 1.35; pointer-events: none;
    box-shadow: 0 2px 10px rgba(20, 40, 60, 0.18);
  }
  #hint { top: 84px; border-left: 3px solid var(--ally); }
  #toast { top: 130px; border-left: 3px solid var(--danger); }

  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 14px; background: rgba(18, 30, 42, 0.42);
  }
  .card {
    background: var(--panel); max-width: 420px; width: 100%; padding: 20px 18px 18px;
    border-radius: 18px; box-shadow: 0 10px 40px rgba(10, 25, 40, 0.3);
    max-height: 100%; overflow-y: auto; touch-action: pan-y;
  }
  h1 { font-size: 28px; margin: 0 0 6px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 18px 0 8px; font-weight: 700; }
  p { margin: 0 0 8px; color: var(--muted); line-height: 1.45; font-size: 14px; }
  .small { font-size: 12.5px; margin-top: 6px; }
  .stats { font-size: 18px; color: var(--ink); font-weight: 600; }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; padding: 10px 4px; border-radius: 10px; border: 2px solid transparent;
    background: var(--soft); color: var(--ink); font-weight: 700; font-size: 14px;
  }
  .seg button.on { border-color: var(--accent); background: rgba(46, 110, 212, 0.14); }
  .classes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cls {
    text-align: left; padding: 9px 10px; border-radius: 12px; border: 2px solid transparent;
    background: var(--soft); color: var(--ink);
  }
  .cls.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .cls b { display: flex; align-items: center; gap: 7px; font-size: 14px; }
  .cls .dot { width: 13px; height: 13px; border-radius: 50%; background: var(--c); flex: none; }
  .cls small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 4px; line-height: 1.3; }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper button {
    width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--soft);
    color: var(--ink); font-size: 20px; font-weight: 700; line-height: 1;
  }
  .stepper button:disabled { opacity: 0.35; cursor: default; }
  .stepper span { font-weight: 700; font-size: 15px; min-width: 110px; text-align: center; }
  .srow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--soft); }
  .srow:first-child { border-top: 0; }
  .srow b { display: block; font-size: 14px; }
  .srow small { color: var(--muted); font-size: 12px; }
  .chips { display: flex; gap: 7px; }
  .chipc { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; background: var(--c); padding: 0; }
  .chipc.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--panel) inset; }
  details { margin-top: 14px; }
  summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--ink); }
  .controls { border-left: 3px solid var(--accent); padding-left: 10px; margin-top: 8px; }
  .controls p { margin: 0 0 4px; color: var(--ink); font-size: 13px; }
  .go {
    font-weight: 700; font-size: 18px; background: var(--accent); color: #fff;
    border: 0; border-radius: 12px; padding: 13px 18px; width: 100%; margin-top: 14px;
  }
  .ghost { background: var(--soft); color: var(--ink); margin-top: 8px; font-size: 16px; }
</style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud" class="hidden">
    <div class="chip" id="hp" aria-label="Points de vie"></div>
    <div class="chip" id="classChip"></div>

  </div>

    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4.5h-4.5"/></svg>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const hpEl = document.getElementById('hp');
  const classEl = document.getElementById('classChip');
  const timerEl = document.getElementById('timer');
  const turretEl = document.getElementById('turretCount');
  const droidEl = document.getElementById('droidCount');
  const squadEl = document.getElementById('squad');
  const hintEl = document.getElementById('hint');
  const toastEl = document.getElementById('toast');
  const overlay = document.getElementById('overlay');
  const card = document.getElementById('card');
  const weaponsEl = document.getElementById('weapons');
  const swapBtn = document.getElementById('swapBtn');
  const reloadBtn = document.getElementById('reloadBtn');
  const rollBtn = document.getElementById('rollBtn');


  // Carte courante : remplie par applyLevel() à partir d'une définition de niveau
  let W = 640, H = 1500;
  const WALL = 16;
  const BEACON = { x: 320, y: 72 }, START = { x: 320, y: 1430 };
  // Points de vie par classe (miroir des droïdes : le lourd encaisse, le tireur d'élite est fragile)
  const CLASS_HP = { classique: 5, medecin: 5, lourd: 7, sniper: 4 };
  const isTouch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  const obstacles = [];
  let levelTurrets = [];   // [x, y, angle de repos]
  let levelDroids = [];    // [x, y, "classe recrue classe soldat classe vétéran"]
  let LEVEL = null;

  // ---------- géométrie ----------
  // Segment contre boîte (Liang-Barsky), sans allocation : c'est la fonction la plus appelée du jeu
  function segHitsBox(x1, y1, x2, y2, bx0, by0, bx1, by1) {
    if ((x1 < bx0 && x2 < bx0) || (x1 > bx1 && x2 > bx1) || (y1 < by0 && y2 < by0) || (y1 > by1 && y2 > by1)) return false;
    let t0 = 0, t1 = 1;
    const dx = x2 - x1, dy = y2 - y1;
    if (dx === 0) { if (x1 < bx0 || x1 > bx1) return false; }
    else {
      let ta = (bx0 - x1) / dx, tb = (bx1 - x1) / dx;
      if (ta > tb) { const t = ta; ta = tb; tb = t; }
      if (ta > t0) t0 = ta; if (tb < t1) t1 = tb;
      if (t0 > t1) return false;
    }
    if (dy === 0) { if (y1 < by0 || y1 > by1) return false; }
    else {
      let ta = (by0 - y1) / dy, tb = (by1 - y1) / dy;
      if (ta > tb) { const t = ta; ta = tb; tb = t; }
      if (ta > t0) t0 = ta; if (tb < t1) t1 = tb;
      if (t0 > t1) return false;
    }
    return true;
  }
  function segHitsRect(x1, y1, x2, y2, r) { return segHitsBox(x1, y1, x2, y2, r.x, r.y, r.x + r.w, r.y + r.h); }
  function hasLOS(ax, ay, bx, by) {
    for (const o of obstacles) if (segHitsRect(ax, ay, bx, by, o)) return false;
    return true;
  }
  function pathClear(ax, ay, bx, by, pad) {
    for (const o of obstacles) if (segHitsBox(ax, ay, bx, by, o.x - pad, o.y - pad, o.x + o.w + pad, o.y + o.h + pad)) return false;
    return true;
  }
  function blockedAt(x, y, pad) {
    for (const o of obstacles) if (x > o.x - pad && x < o.x + o.w + pad && y > o.y - pad && y < o.y + o.h + pad) return true;
    return false;
  }
  function inRect(x, y, o) { return x > o.x && x < o.x + o.w && y > o.y && y < o.y + o.h; }
  function angDiff(a, b) {
    let d = b - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
  function pushOutRect(c, o) {
    const cx = Math.max(o.x, Math.min(c.x, o.x + o.w));
    const cy = Math.max(o.y, Math.min(c.y, o.y + o.h));
    const dx = c.x - cx, dy = c.y - cy, d = Math.hypot(dx, dy);
    if (d < c.r && d > 0) { const push = c.r - d; c.x += dx / d * push; c.y += dy / d * push; }
  }
  function pushOutCircle(c, o, r) {
    const dx = c.x - o.x, dy = c.y - o.y, d = Math.hypot(dx, dy), min = c.r + r;
    if (d < min && d > 0) { c.x += dx / d * (min - d); c.y += dy / d * (min - d); }
  }
  function clampInArena(u) {
    u.x = Math.max(WALL + u.r, Math.min(W - WALL - u.r, u.x));
    u.y = Math.max(WALL + u.r, Math.min(H - WALL - u.r, u.y));
  }

  // ---------- points d'abri des droïdes ----------
  const coverPoints = [];
  function buildCover() {
    coverPoints.length = 0;
    for (const o of obstacles) {
      const off = 15, pts = [];
      for (let x = o.x + 8; x <= o.x + o.w - 8; x += 18) pts.push([x, o.y - off], [x, o.y + o.h + off]);
      for (let y = o.y + 8; y <= o.y + o.h - 8; y += 18) pts.push([o.x - off, y], [o.x + o.w + off, y]);
      for (const [x, y] of pts) {
        if (x < WALL + 12 || x > W - WALL - 12 || y < WALL + 12 || y > H - WALL - 12) continue;
        if (blockedAt(x, y, 11)) continue;
        coverPoints.push({ x, y });
      }
    }
  }

  // ---------- postes des alliés ----------
  // Derrière chaque obstacle côté départ (tirs sur les côtés), et le long des murs verticaux (tir par le haut du mur)
  const allyPosts = [];
  function buildAllyPosts() {
    allyPosts.length = 0;
    const ok = (x, y) => x > WALL + 12 && x < W - WALL - 12 && y > WALL + 12 && y < H - WALL - 12 && !blockedAt(x, y, 11);
    for (const o of obstacles) {
      const y = o.y + o.h + 15;
      if (y < H - WALL - 14) {
        const xs = o.w >= 90 ? [o.x + o.w * 0.28, o.x + o.w * 0.72] : [o.x + o.w / 2];
        const peeks = [[o.x - 17, o.y + o.h + 3], [o.x + o.w + 17, o.y + o.h + 3]].filter(([x, py]) => ok(x, py)).map(([x, py]) => ({ x, y: py }));
        for (const x of xs) if (ok(x, y)) allyPosts.push({ x, y, peeks });
      }
      if (o.h >= 60) {
        for (const side of [-1, 1]) {
          const x = side < 0 ? o.x - 15 : o.x + o.w + 15, py = o.y + o.h - 20;
          const peek = { x, y: o.y - 14 };
          if (ok(x, py)) allyPosts.push({ x, y: py, side: true, peeks: ok(peek.x, peek.y) ? [peek] : [] });
        }
      }
    }
    // pas de doublons trop proches
    for (let i = allyPosts.length - 1; i >= 0; i--) {
      for (let j = 0; j < i; j++) if (Math.hypot(allyPosts[i].x - allyPosts[j].x, allyPosts[i].y - allyPosts[j].y) < 20) { allyPosts.splice(i, 1); break; }
    }
  }

  // ---------- navigation (grille + A*) ----------
  const CELL = 16;
  let COLS = 0, ROWS = 0, blocked = new Uint8Array(0);
  let navG, navCame, navSeen, navClosed, navGen = 0;
  function buildNav() {
    COLS = Math.ceil(W / CELL); ROWS = Math.ceil(H / CELL);
    blocked = new Uint8Array(COLS * ROWS);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const x = c * CELL + CELL / 2, y = r * CELL + CELL / 2;
      let b = x < WALL + 11 || x > W - WALL - 11 || y < WALL + 11 || y > H - WALL - 11 || blockedAt(x, y, 11);
      if (!b) for (const [tx, ty] of levelTurrets) if (Math.hypot(x - tx, y - ty) < 29) { b = true; break; }
      blocked[r * COLS + c] = b ? 1 : 0;
    }
    const n = COLS * ROWS;
    navG = new Float32Array(n); navCame = new Int32Array(n); navSeen = new Uint32Array(n); navClosed = new Uint32Array(n); navGen = 0;
  }
  // Cases atteignables depuis un point (sert à valider les niveaux)
  function floodFrom(x, y) {
    const reach = new Uint8Array(COLS * ROWS);
    const [c0, r0] = nearestFree(x, y);
    const q = [r0 * COLS + c0]; reach[q[0]] = 1;
    for (let h = 0; h < q.length; h++) {
      const i = q[h], ci = i % COLS, ri = (i / COLS) | 0;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const nc = ci + dc, nr = ri + dr;
        if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
        const ni = nr * COLS + nc;
        if (reach[ni] || blocked[ni]) continue;
        if (dr && dc && (blocked[ri * COLS + nc] || blocked[nr * COLS + ci])) continue;
        reach[ni] = 1; q.push(ni);
      }
    }
    return reach;
  }
  function reachable(reach, x, y) { const [c, r] = nearestFree(x, y); return !!reach[r * COLS + c]; }

  function nearestFree(x, y) {
    const c0 = Math.max(0, Math.min(COLS - 1, Math.floor(x / CELL)));
    const r0 = Math.max(0, Math.min(ROWS - 1, Math.floor(y / CELL)));
    if (!blocked[r0 * COLS + c0]) return [c0, r0];
    for (let rad = 1; rad < 8; rad++)
      for (let dr = -rad; dr <= rad; dr++) for (let dc = -rad; dc <= rad; dc++) {
        const c = c0 + dc, r = r0 + dr;
        if (c >= 0 && r >= 0 && c < COLS && r < ROWS && !blocked[r * COLS + c]) return [c, r];
      }
    return [c0, r0];
  }
  // Tableaux de l'A* alloués une fois par niveau ; un numéro de passage évite de les remettre à zéro
  const heapF = [], heapI = [];
  function heapPush(f, i) {
    let k = heapF.length; heapF.push(f); heapI.push(i);
    while (k > 0) {
      const p = (k - 1) >> 1;
      if (heapF[p] <= f) break;
      heapF[k] = heapF[p]; heapI[k] = heapI[p]; k = p;
    }
    heapF[k] = f; heapI[k] = i;
  }
  function heapPop() {
    const top = heapI[0];
    const lf = heapF.pop(), li = heapI.pop();
    const n = heapF.length;
    if (n) {
      let k = 0;
      for (;;) {
        const l = 2 * k + 1, r = l + 1; let m = -1, mf = lf;
        if (l < n && heapF[l] < mf) { m = l; mf = heapF[l]; }
        if (r < n && heapF[r] < mf) { m = r; mf = heapF[r]; }
        if (m < 0) break;
        heapF[k] = heapF[m]; heapI[k] = heapI[m]; k = m;
      }
      heapF[k] = lf; heapI[k] = li;
    }
    return top;
  }
  function findPath(sx, sy, tx, ty) {
    const [sc, sr] = nearestFree(sx, sy), [tc, tr] = nearestFree(tx, ty);
    const start = sr * COLS + sc, goal = tr * COLS + tc;
    navGen++;
    heapF.length = 0; heapI.length = 0;
    const hf = i => { const dx = Math.abs(i % COLS - tc), dy = Math.abs(((i / COLS) | 0) - tr); return dx + dy - 0.586 * Math.min(dx, dy); };
    navG[start] = 0; navSeen[start] = navGen; navCame[start] = -1;
    heapPush(hf(start), start);
    let found = start === goal;
    while (heapF.length && !found) {
      const i = heapPop();
      if (navClosed[i] === navGen) continue;
      navClosed[i] = navGen;
      if (i === goal) { found = true; break; }
      const ci = i % COLS, ri = (i / COLS) | 0, gi = navG[i];
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const nc = ci + dc, nr = ri + dr;
        if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
        const ni = nr * COLS + nc;
        if (blocked[ni] || navClosed[ni] === navGen) continue;
        if (dr && dc && (blocked[ri * COLS + nc] || blocked[nr * COLS + ci])) continue;
        const ng = gi + (dr && dc ? 1.414 : 1);
        if (navSeen[ni] !== navGen || ng < navG[ni]) { navSeen[ni] = navGen; navG[ni] = ng; navCame[ni] = i; heapPush(ng + hf(ni), ni); }
      }
    }
    if (!found) return [{ x: tx, y: ty }];
    const cells = [];
    for (let i = goal; i !== start && i !== -1; i = navCame[i]) cells.push({ x: (i % COLS) * CELL + CELL / 2, y: ((i / COLS) | 0) * CELL + CELL / 2 });
    cells.reverse(); cells.push({ x: tx, y: ty });
    const out = []; let cx = sx, cy = sy, k = 0;
    while (k < cells.length) {
      let j = cells.length - 1;
      while (j > k && !pathClear(cx, cy, cells[j].x, cells[j].y, 10)) j--;
      out.push(cells[j]); cx = cells[j].x; cy = cells[j].y; k = j + 1;
    }
    return out;
  }
  function moveUnit(u, tx, ty, speed, dt) {
    const dx = tx - u.x, dy = ty - u.y, dist = Math.hypot(dx, dy);
    if (dist < 1) return dist;
    const step = Math.min(dist, speed * dt);
    u.x += dx / dist * step; u.y += dy / dist * step;
    u.moveAng = Math.atan2(dy, dx); u.moving = true;
    return dist;
  }
  function navTo(u, tx, ty, speed, dt) {
    // chemin recalculé si la cible a bougé (au plus 4 fois par seconde) ou toutes les 1,2 s
    if (!u.nav || u.nav.repath <= 0 || (u.nav.age > 0.25 && Math.hypot(u.nav.tx - tx, u.nav.ty - ty) > 24)) {
      const direct = pathClear(u.x, u.y, tx, ty, 10);
      u.nav = { tx, ty, repath: 1.2, age: 0, pts: direct ? [{ x: tx, y: ty }] : findPath(u.x, u.y, tx, ty) };
    } else if (u.nav.pts.length === 1 && u.nav.direct !== false && pathClear(u.x, u.y, tx, ty, 10)) {
      const last = u.nav.pts[0]; last.x = tx; last.y = ty; u.nav.tx = tx; u.nav.ty = ty;   // ligne droite : suit la cible en continu
    }
    u.nav.repath -= dt; u.nav.age += dt;
    const p = u.nav.pts[0];
    if (p) {
      const d = moveUnit(u, p.x, p.y, speed, dt);
      if (d < 5 && u.nav.pts.length > 1) u.nav.pts.shift();
    }
    return Math.hypot(tx - u.x, ty - u.y);
  }
  function turnTo(u, target, rate, dt) {
    const diff = angDiff(u.ang, target);
    u.ang += Math.max(-rate * dt, Math.min(rate * dt, diff));
    return diff;
  }


  // ---------- difficultés et classes ----------
  const DIFFS = {
    recrue:  { label: 'Recrue',  droidHp: 4, turretHp: 2, droidRange: 260, turretRange: 480, aimMul: 1.3, cdMul: 1.25, enemyRockets: 1,
               desc: 'Ennemis moins résistants, qui te repèrent de moins loin.' },
    soldat:  { label: 'Soldat',  droidHp: 5, turretHp: 3, droidRange: 320, turretRange: 580, aimMul: 1, cdMul: 1, enemyRockets: 2,
               desc: 'L\'équilibre du prototype.' },
    veteran: { label: 'Vétéran', droidHp: 6, turretHp: 4, droidRange: 380, turretRange: 620, aimMul: 0.8, cdMul: 0.85, enemyRockets: 2,
               desc: 'Ennemis robustes qui te voient de très loin : avance prudemment d\'abri en abri.' }
  };
  const CLASSES = {
    classique: { name: 'Classique', color: '#3AA55A', desc: 'Blaster polyvalent à bonne cadence. 5 PV.' },
    medecin:   { name: 'Médecin',   color: '#2E6ED4', desc: 'Soigne un équipier proche quand vous êtes hors de vue. En IA : envoie-le soigner. 5 PV.' },
    lourd:     { name: 'Lourd',     color: '#D23F2B', desc: 'Bazooka (5 roquettes, recharge manuelle) et pistolet. 7 PV. En IA : il demande ton accord.' },
    sniper:    { name: 'Sniper',    color: '#8E5BD6', desc: 'Touche un ennemi pour le verrouiller (1 s) : tir auto à 2 dégâts. 4 PV, fragile.' }
  };
  const CLASS_KEYS = Object.keys(CLASSES);
  const ROLL_DUR = 0.44, ROLL_PREP = 0.05, ROLL_MOVE = 0.34, ROLL_DIST = 90, ROLL_CD_PLAYER = 1.6, ROLL_CD_AI = 2.5, ROLL_LOW_HP = 0.25;
  const ROCKET_R = 55, ROCKET_RANGE = 260, ROCKETS_PER_GAME = 5, RELOAD_TIME = 2.8, PISTOL_DMG = 0.5;
  let DIFF = DIFFS.soldat;

  let cfg = { diff: 'soldat', player: 'classique', count: 3, squad: ['classique', 'medecin', 'sniper'], level: 'citadelle' };
  try {
    const saved = JSON.parse(localStorage.getItem('arene-cfg') || 'null');
    if (saved && DIFFS[saved.diff] && CLASSES[saved.player] && Array.isArray(saved.squad)) {
      cfg.diff = saved.diff; cfg.player = saved.player; if (typeof saved.level === 'string') cfg.level = saved.level;
      cfg.count = Math.max(0, Math.min(3, saved.count | 0));
      cfg.squad = [0, 1, 2].map(i => CLASSES[saved.squad[i]] ? saved.squad[i] : 'classique');
    }
  } catch (e) {}
  function saveCfg() { try { localStorage.setItem('arene-cfg', JSON.stringify(Object.assign({}, cfg, { level: cfg.level.startsWith('essai-') ? 'citadelle' : cfg.level }))); } catch (e) {} }
  // clé du meilleur temps : niveau + difficulté (la Citadelle garde l'ancienne clé)
  const bestKey = diff => 'arene-best-' + (cfg.level === 'citadelle' ? '' : cfg.level + '-') + diff;
  function getBest(diff) { try { const v = localStorage.getItem(bestKey(diff)); return v ? parseFloat(v) : null; } catch (e) { return null; } }
  function setBest(diff, v) { try { localStorage.setItem(bestKey(diff), String(v)); } catch (e) {} }

  // ---------- formes d'obstacles ----------
  // L : coin (carré t×t) en (x, y) ; bras horizontal de longueur a vers dx (±1), bras vertical de longueur b vers dy (±1)
  function L(x, y, dx, a, dy, b, t = 22) {
    return [dx > 0 ? [x, y, a, t] : [x + t - a, y, a, t], dy > 0 ? [x, y, t, b] : [x, y + t - b, t, b]];
  }
  // Z : barre haute de longueur a, descente de b, barre basse de longueur c (S = Z en miroir)
  function Z(x, y, a, b, c, t = 22) { return [[x, y, a, t], [x + a - t, y, t, b], [x + a - t, y + b - t, c, t]]; }
  function S(x, y, a, b, c, t = 22) { const w = a + c - t; return Z(0, 0, a, b, c, t).map(([rx, ry, rw, rh]) => [x + w - rx - rw, y + ry, rw, rh]); }
  function bbox(rects) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y, w, h] of rects) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); }
    return { x0, y0, x1, y1 };
  }
  const HALF_PI = Math.PI / 2, LEFT_WALL = WALL + 18;

  // ---------- niveaux dessinés à la main ----------
  // droïdes : [x, y, "recrue soldat vétéran"] avec c = combat, l = lourd, m = réparateur, s = tireur d'élite, - = absent
  const LEVELS = [
    {
      id: 'citadelle', name: 'Citadelle', desc: 'Le terrain d\'entraînement d\'origine : une ligne de tourelles au fond, des abris simples.',
      W: 640, H: 1500, start: { x: 320, y: 1430 }, beacon: { x: 320, y: 72 },
      obstacles: [
        [80, 1300, 110, 28], [450, 1300, 110, 28], [270, 1180, 100, 40], [60, 1060, 44, 100], [536, 1060, 44, 100],
        [180, 1000, 80, 28], [380, 1000, 80, 28], [290, 860, 60, 60], [180, 900, 36, 40], [424, 900, 36, 40],
        [100, 780, 110, 26], [430, 780, 110, 26], [230, 660, 40, 40], [370, 660, 40, 40],
        [120, 540, 90, 28], [430, 540, 90, 28], [300, 520, 40, 70], [60, 400, 44, 90], [536, 400, 44, 90],
        [210, 420, 70, 28], [360, 420, 70, 28], [150, 290, 44, 44], [446, 290, 44, 44], [296, 300, 48, 24]
      ],
      turrets: [[130, 165, HALF_PI], [250, 165, HALF_PI], [390, 165, HALF_PI], [510, 165, HALF_PI]],
      droids: [[140, 920, 'c c c'], [500, 920, 'c c l'], [320, 740, 'l l c'], [170, 470, 'm m m'], [470, 470, 'c c c'], [320, 360, 'c s s']]
    },
    {
      id: 'feux-croises', name: 'Feux croisés', desc: 'Des tourelles sur les murs balaient l\'arène de côté : les abris en L protègent de face et de flanc.',
      W: 640, H: 1600, start: { x: 320, y: 1530 }, beacon: { x: 320, y: 72 },
      obstacles: [
        [110, 1400, 100, 24], [430, 1400, 100, 24], [280, 1290, 80, 26],
        ...L(110, 1150, 1, 110, 1, 100), [300, 1170, 50, 50], [440, 1170, 110, 24],
        [110, 1000, 90, 24], [290, 1010, 40, 40], ...L(508, 950, -1, 110, 1, 100),

        if (Math.hypot(t.x - a.x, t.y - a.y) < 42 && safe) {
          a.healT += dt;
          if (a.healT >= 0.9) { a.healT = 0; heal(t); if (t.hp >= t.maxHp) endHeal(a); }
        }
      }
    } else if (a.mode === 'post') {
      const post = a.post;
      if (a.phase === 'move') {
        if (navTo(a, post.x, post.y, 165, dt) < 6) { a.phase = 'hide'; a.nav = null; }
      } else {
        const near = Math.hypot(player.x - post.x, player.y - post.y) < 200;
        // très blessé (25 % de vie ou moins) : il ne sort plus couvrir, il reste à l'abri
        const wantCover = near && playerExposed && a.hp / a.maxHp > ROLL_LOW_HP;
        if (a.phase === 'hide') {
          if (Math.hypot(post.x - a.x, post.y - a.y) > 3) moveUnit(a, post.x, post.y, 150, dt);
          if (wantCover) { const pk = choosePeek(a); if (pk) { a.phase = 'peek'; a.peek = pk; a.peekT = 0; a.peekCheck = 1; } }
        } else if (a.phase === 'peek') {
          a.peekT += dt; a.peekCheck -= dt;
          moveUnit(a, a.peek.x, a.peek.y, 170, dt);
          if (a.peekCheck <= 0) { a.peekCheck = 1; const pk = choosePeek(a); if (pk) a.peek = pk; }
          if ((a.peekT > 0.8 && !wantCover) || a.hp / a.maxHp <= ROLL_LOW_HP) a.phase = 'hide';
        }
      }
    }
    // Très blessé, à découvert et en train de rejoindre un abri ou sa place : roulade vers sa destination
    if (canRoll(a) && a.rollCd <= 0 && a.moving && a.hp / a.maxHp <= ROLL_LOW_HP && enemySees(a)) {
      const dest = a.nav && a.nav.pts[0] ? a.nav.pts[0] : a.mode === 'post' && a.post ? (a.phase === 'peek' ? a.peek : a.post) : null;
      const dist = dest ? Math.hypot(dest.x - a.x, dest.y - a.y) : ROLL_DIST;
      if (dist > 40) { startRoll(a, a.moveAng, Math.min(ROLL_DIST, dist - 4), ROLL_CD_AI); return; }
    }
    allyShoot(a, dt);
  }

  // ---------- roquettes du Lourd IA ----------
  function rocketZoneClear(imp, shooter, from) {
    for (const f of friends()) {
      if (f === shooter) continue;
      if (Math.hypot(f.x - imp.x, f.y - imp.y) <= ROCKET_R + f.r + 6) return false;
    }
    const s = from || shooter;
    return Math.hypot(s.x - imp.x, s.y - imp.y) > ROCKET_R + shooter.r + 6;
  }
  // Cherche un tir possible depuis sa position actuelle ou depuis les côtés de son abri
  function findRocketShot(a) {
    const spots = [{ x: a.x, y: a.y }];
    if (a.mode === 'post' && a.post) for (const p of a.post.peeks) spots.push(p);
    let bestS = null, bs = Infinity;
    spots.forEach((pos, i) => {
      for (const e of aliveEnemies()) {
        const d = Math.hypot(e.x - pos.x, e.y - pos.y);
        if (d > ROCKET_RANGE || !hasLOS(pos.x, pos.y, e.x, e.y)) continue;
        const imp = predictImpact(pos.x, pos.y, e.x, e.y);
        if (Math.hypot(imp.x - e.x, imp.y - e.y) > ROCKET_R * 0.6) continue;
        if (!rocketZoneClear(imp, a, pos)) continue;
        const score = d + (i === 0 ? 0 : 60) + Math.hypot(pos.x - a.x, pos.y - a.y);
        if (score < bs) { bs = score; bestS = { pos, tgt: e, imp }; }
      }
    });
    return bestS;
  }
  // Tir autorisé : il se décale jusqu'à la position de tir, tire, puis retourne derrière son abri
  function runRocketMission(a, dt) {
    const m = a.rocketMission, t = m.tgt;
    m.t += dt;
    if (t.hp <= 0 || m.t > 5) { a.rocketMission = null; a.rocketPlan = null; a.shotCheck = 0; if (a.mode === 'post') a.phase = 'hide'; return; }
    if (Math.hypot(m.pos.x - a.x, m.pos.y - a.y) > 4) {
      if (pathClear(a.x, a.y, m.pos.x, m.pos.y, 8)) moveUnit(a, m.pos.x, m.pos.y, 170, dt);
      else navTo(a, m.pos.x, m.pos.y, 170, dt);
      turnTo(a, Math.atan2(t.y - a.y, t.x - a.x), 6, dt);
      a.rocketAimT = 0;
      return;
    }
    a.nav = null;
    if (!hasLOS(a.x, a.y, t.x, t.y)) { a.rocketMission = null; a.shotCheck = 0; if (a.mode === 'post') a.phase = 'hide'; return; }
    const diff = turnTo(a, Math.atan2(t.y - a.y, t.x - a.x), 6, dt);
    const imp = predictImpact(a.x, a.y, t.x, t.y);
    m.imp = imp; a.rocketZone = imp;
    a.rocketAimT += dt;
    if (rocketZoneClear(imp, a) && a.rocketAimT > 0.6 && Math.abs(diff) < 0.15) {
      fireRocket(a, imp);
      a.rocketAuth = false; a.loaded = false; a.rocketsLeft--; a.reloadT = RELOAD_TIME; a.rocketAimT = 0; a.cd = 0.8; a.reqNotified = false;
      a.rocketMission = null; a.rocketPlan = null; a.rocketZone = null;
      if (a.mode === 'post' && a.post) a.phase = 'hide';   // retour derrière l'abri
    }
  }

  function allyShoot(a, dt) {
    const idle = () => { a.aimT = 0; turnTo(a, a.moving ? a.moveAng : -Math.PI / 2, 5, dt); };

    if (a.cls === 'sniper') {
      let tgt = a.manualTgt && a.manualTgt.hp > 0 ? a.manualTgt : null;
      if (!tgt) { a.manualTgt = null; tgt = nearestVisibleEnemy(a.x, a.y, 700); }
      if (!tgt) { a.lock = null; idle(); return; }
      if (!a.lock || a.lock.tgt !== tgt) a.lock = { tgt, t: 0 };
      a.lock.t += dt;
      turnTo(a, Math.atan2(tgt.y - a.y, tgt.x - a.x), 5, dt);
      if (a.lock.t >= 1 && a.cd <= 0 && lockLineClear(a, tgt)) {
        fireBolt(a, a.ang, 900, 2, 'snipe', tgt);
        a.cd = 2.4 + Math.random() * 0.5;   // latence entre deux tirs pour l'équilibre
      }
      return;
    }

    const tgt = nearestVisibleEnemy(a.x, a.y, 400);

    if (a.cls === 'lourd') {
      a.shotCheck -= dt;
      if (!a.loaded || a.rocketsLeft <= 0) a.rocketPlan = null;
      else if (a.shotCheck <= 0) { a.shotCheck = 0.25; a.rocketPlan = findRocketShot(a); }
      const plan = a.rocketPlan;
      a.rocketZone = plan ? plan.imp : null;
      a.rocketRequest = !!plan && !a.rocketAuth;
      if (plan && a.rocketAuth) { a.rocketMission = { pos: plan.pos, tgt: plan.tgt, imp: plan.imp, t: 0 }; a.rocketAimT = 0; return; }
      if (a.rocketRequest && !a.reqNotified) {
        a.reqNotified = true;
        Sound.play('request');
        toast(`${a.name} a une cible pour sa roquette, zone dégagée. Touche « Feu » près de sa bulle.`);
      }
    }

    if (tgt) {
      const diff = turnTo(a, Math.atan2(tgt.y - a.y, tgt.x - a.x), 6, dt);
      a.aimT += dt;
      if (a.aimT > 0.4 && a.cd <= 0 && Math.abs(diff) < 0.2) {
        const heavy = a.cls === 'lourd';
        fireBolt(a, a.ang + (Math.random() - 0.5) * 0.14, heavy ? 420 : 480, heavy ? PISTOL_DMG : 1, heavy ? 'pistol' : 'bolt');
        a.cd = heavy ? 1.5 + Math.random() * 0.4 : a.cls === 'medecin' ? 1.0 + Math.random() * 0.4 : 0.75 + Math.random() * 0.35;
      }
    } else idle();
  }

  const STATUS_ICONS = {
    'Me suit': { bg: '#2E6ED4', svg: '<path d="M3 8.5l4-4 4 4M3 12l4-4 4 4"/>' },
    'En route': { bg: '#D9962B', svg: '<path d="M2 7h9M8 3.5L11.5 7 8 10.5"/>' },
    'À couvert': { bg: '#5E7A94', svg: '<path d="M7 1.8l4.5 1.8v3.4c0 2.6-2 4.3-4.5 5.3C4.5 11.3 2.5 9.6 2.5 7V3.6z"/>' },
    'Tir de couverture': { bg: '#E0672B', svg: '<circle cx="7" cy="7" r="3.8"/><path d="M7 1v2.5M7 10.5V13M1 7h2.5M10.5 7H13"/>' },
    'Tir de roquette': { bg: '#D23F2B', svg: '<path d="M3 11l2.2-2.2M5.5 8.5L10 4l1.5-1.5-.5 2.5-4.5 4.5zM4 7.5l2.5 2.5"/>' },
    'Soigne': { bg: '#2EAD6B', svg: '<path d="M7 2.5v9M2.5 7h9"/>' },
    'Blessé': { bg: '#D23F2B', svg: '<path d="M7 3v8M3 7h8"/>' }
  };
  function allyStatus(a) {
    if (a.hp <= 0) return 'Blessé';
    if (a.rocketMission) return 'Tir de roquette';
    if (a.mode === 'follow') return 'Me suit';
    if (a.mode === 'heal') return 'Soigne';
    if (a.phase === 'move') return 'En route';
    if (a.phase === 'peek') return 'Tir de couverture';
    return 'À couvert';
  }

  // ---------- ordres ----------
  function setSelected(i) {
    if (i >= 0 && (!allies[i] || allies[i].hp <= 0)) i = -1;
    selected = i;
    if (i >= 0) {
      const a = allies[i];
      let extra = '';
      if (a.cls === 'medecin') extra = ', une croix verte pour soigner';
      if (a.cls === 'sniper') extra = ', un ennemi pour le verrouiller';
      hintEl.textContent = `${a.name} : touche un abri en surbrillance${extra}, ou ton soldat pour qu'il te suive.`;
      hintEl.classList.remove('hidden');
    } else hintEl.classList.add('hidden');
    refreshSquad(true);
  }
  function computeHighlight() {
    if (selected < 0) { highlight = []; return; }
    const a = allies[selected];
    highlight = allyPosts.filter(p => !postTaken(p, a))
      .map(p => ({ p, d: Math.hypot(p.x - player.x, p.y - player.y) }))
      .filter(o => o.d < 330).sort((m, n) => m.d - n.d).slice(0, 8).map(o => o.p);
  }
  function handleTap(sx, sy) {
    if (state !== 'play') return;
    const wx = sx / scale + camX, wy = sy / scale + camY;
    const tol = Math.max(26, 30 / scale);
    if (selected < 0) {
      if (player.cls === 'sniper') { const e = enemyAt(wx, wy, tol); if (e) { player.lock = { tgt: e, t: 0 }; Sound.play('lockStart'); } }
      return;
    }
    const a = allies[selected];
    const cands = [];
    if (a.cls === 'sniper') for (const e of aliveEnemies()) cands.push({ d: Math.hypot(wx - e.x, wy - e.y) - e.r, act: () => { a.manualTgt = e; a.lock = { tgt: e, t: 0 }; } });
    if (a.cls === 'medecin') for (const h of healTargets(a)) cands.push({ d: Math.hypot(wx - h.x, wy - (h.y - 34)), act: () => orderHeal(a, h) });
    cands.push({ d: Math.hypot(wx - player.x, wy - player.y), act: () => { a.mode = 'follow'; a.post = null; a.phase = null; a.nav = null; a.healTarget = null; a.prevPost = null; } });
    for (const p of highlight) cands.push({ d: Math.hypot(wx - p.x, wy - p.y), act: () => { a.mode = 'post'; a.post = p; a.phase = 'move'; a.nav = null; a.healTarget = null; a.prevPost = null; } });
    let bestC = null;
    for (const c of cands) if (c.d < tol && (!bestC || c.d < bestC.d)) bestC = c;
    if (bestC) { a.rocketMission = null; bestC.act(); Sound.play('order'); }
    setSelected(-1);
  }
  function approveRocket(i) {
    const a = allies[i];
    if (!a || a.hp <= 0) return;
    a.rocketAuth = true; a.rocketRequest = false;
    refreshSquad(true);
  }

  function swapWeapon() {
    if (state !== 'play' || player.cls !== 'lourd') return;
    if (player.rocketsLeft <= 0) { player.weapon = 'pistol'; return; }
    player.weapon = player.weapon === 'bazooka' ? 'pistol' : 'bazooka';
    player.heavyWasAiming = false;
  }
  function reloadRocket() {
    if (state !== 'play' || player.cls !== 'lourd') return;
    if (!player.loaded && player.rocketsLeft > 0 && player.reloadT <= 0) { player.reloadT = RELOAD_TIME; Sound.play('reload'); }
  }
  swapBtn.addEventListener('click', swapWeapon);
  reloadBtn.addEventListener('click', reloadRocket);
  let weaponsCache = '';
  function updateWeaponsUi() {
    const show = state === 'play' && player.cls === 'lourd';
    weaponsEl.classList.toggle('hidden', !show);
    if (!show) return;
    const out = player.rocketsLeft <= 0;
    const canReload = !player.loaded && player.rocketsLeft > 0 && player.reloadT <= 0;
    const urgent = canReload && player.weapon === 'bazooka';
    const prog = player.reloadT > 0 ? Math.round((1 - player.reloadT / RELOAD_TIME) * 100) : 0;
    const key = `${player.weapon}|${player.rocketsLeft}|${player.loaded}|${canReload}|${urgent}|${prog}`;
    if (key === weaponsCache) return;
    weaponsCache = key;
    swapBtn.querySelector('.lbl').textContent = out ? 'Pistolet (plus de roquettes)' : player.weapon === 'bazooka' ? 'Passer au pistolet' : 'Passer au bazooka';
    swapBtn.disabled = out;
    reloadBtn.querySelector('.lbl').textContent = out ? 'Plus de roquettes' : player.reloadT > 0 ? 'Recharge…' : player.loaded ? 'Chargé' : 'Recharger';
    reloadBtn.disabled = !canReload;
    reloadBtn.classList.toggle('urgent', urgent);
    reloadBtn.querySelector('.fill').style.width = prog + '%';
  }

  rollBtn.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') player.wantRoll = true; });
  rollBtn.addEventListener('click', () => { if (state === 'play') player.wantRoll = true; });
  let rollUiCache = '';
  function updateRollUi() {
    const show = state === 'play' && canRoll(player);
    rollBtn.classList.toggle('hidden', !show);
    if (!show) return;
    const cd = Math.max(0, Math.round(player.rollCd / ROLL_CD_PLAYER * 100));
    const key = cd + '|' + player.cls;
    if (key === rollUiCache) return;
    rollUiCache = key;
    rollBtn.style.setProperty('--cd', cd);
    rollBtn.style.setProperty('--c', CLASSES[player.cls].color);
    rollBtn.classList.toggle('cool', cd > 0);
  }

  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.add('hidden'), 3500);
  }

  // ---------- panneau d'escouade ----------
  let squadCache = [];
  function buildSquad() {
    squadEl.innerHTML = allies.map(a => `
      <div class="slot">
        <button class="fire hidden" data-i="${a.i}" aria-label="Autoriser ${a.name} à tirer une roquette">Feu</button>
        <button class="bubble" data-i="${a.i}" aria-label="Donner un ordre à ${a.name}">
          <span class="ring"><span class="core" style="--cc:${CLASSES[a.cls].color}">${a.i + 1}</span><span class="st"></span>${a.cls === 'lourd' ? '<span class="ammo"></span>' : ''}</span>
          <span class="bname">${a.name}</span>
        </button>
      </div>`).join('');
    squadEl.querySelectorAll('.bubble').forEach(b => {
      b.addEventListener('click', () => { const i = +b.dataset.i; setSelected(selected === i ? -1 : i); });
    });
    squadEl.querySelectorAll('.fire').forEach(b => {
      b.addEventListener('click', () => approveRocket(+b.dataset.i));
    });
    squadCache = [];
    squadBubbles = squadEl.querySelectorAll('.bubble'); squadFires = squadEl.querySelectorAll('.fire');
    refreshSquad(true);
  }
  let squadBubbles = [], squadFires = [];
  function refreshSquad(force) {
    const bubbles = squadBubbles, fires = squadFires;
    allies.forEach((a, i) => {
      const status = allyStatus(a);
      const ask = a.hp > 0 && a.rocketRequest && !a.rocketAuth;
      const key = `${a.hp}|${status}|${selected === i}|${ask}|${a.rocketsLeft}`;
      if (!force && squadCache[i] === key) return;
      squadCache[i] = key;
      const b = bubbles[i]; if (!b) return;
      b.classList.toggle('sel', selected === i);
      b.classList.toggle('dead', a.hp <= 0);
      const ring = b.querySelector('.ring');
      ring.style.setProperty('--hp', a.hp > 0 ? Math.round(a.hp / a.maxHp * 100) : 0);
      ring.style.setProperty('--hpc', a.hp / a.maxHp <= 0.4 ? '#E3452C' : '#3A9F66');
      const ic = STATUS_ICONS[status];
      const st = b.querySelector('.st');
      st.style.background = ic.bg;
      st.innerHTML = `<svg viewBox="0 0 14 14" aria-hidden="true">${ic.svg}</svg>`;
      b.setAttribute('aria-label', `${a.name}, ${CLASSES[a.cls].name}, ${status}. Donner un ordre`);
      b.title = `${a.name} (${CLASSES[a.cls].name}) : ${status}`;
      if (fires[i]) fires[i].classList.toggle('hidden', !ask);
      const am = b.querySelector('.ammo');
      if (am) { am.textContent = a.rocketsLeft; am.classList.toggle('empty', a.rocketsLeft <= 0); am.title = `${a.rocketsLeft} roquette(s) restante(s)`; }
    });
  }

  // ---------- entrées ----------
  const keys = {};
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    // en pause : Échap ou P reprend (sauf pendant la saisie dans un champ)
    if (state === 'paused') {
      if ((k === 'escape' || k === 'p') && !(e.target && e.target.tagName === 'INPUT' && e.target.type === 'text')) { e.preventDefault(); resumeGame(); }
      return;
    }
    keys[k] = true;
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
    if (state === 'play') {
      if (k === '1' || k === '2' || k === '3') { const i = +k - 1; if (allies[i]) setSelected(selected === i ? -1 : i); }
      if (k === 'escape' || k === 'p') { if (selected >= 0 && k === 'escape') setSelected(-1); else { showPause(); return; } }
      if (k === 'f') allies.forEach(a => { if (a.rocketRequest) approveRocket(a.i); });
      if (k === 'r') reloadRocket();
      if (k === 'x') swapWeapon();
      if (k === 'shift' || k === 'c') player.wantRoll = true;
    }
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  const STICK_R = 55, STICK_ZONE = 95;
  const baseL = () => ({ x: 82, y: ch - 100 });
  const baseR = () => ({ x: cw - 82, y: ch - 100 });
  const sticks = { move: null, aim: null };
  const mouse = { active: false, x: 0, y: 0, down: false };
  function localPos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  canvas.addEventListener('pointerdown', e => {
    const p = localPos(e);
    if (e.pointerType === 'mouse') {
      mouse.active = true; mouse.x = p.x; mouse.y = p.y;
      if (state !== 'play') return;
      if (selected >= 0) { handleTap(p.x, p.y); return; }
      if (player.cls === 'sniper' && enemyAt(p.x / scale + camX, p.y / scale + camY, Math.max(20, 24 / scale))) { handleTap(p.x, p.y); return; }
      mouse.down = true;
      return;
    }
    const L = baseL(), R = baseR();
    if (!sticks.move && Math.hypot(p.x - L.x, p.y - L.y) < STICK_ZONE) {
      sticks.move = { id: e.pointerId, ox: L.x, oy: L.y, x: p.x, y: p.y };
    } else if (!sticks.aim && Math.hypot(p.x - R.x, p.y - R.y) < STICK_ZONE) {
      sticks.aim = { id: e.pointerId, ox: R.x, oy: R.y, x: p.x, y: p.y };
    } else { handleTap(p.x, p.y); return; }
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', e => {
    const p = localPos(e);
    if (e.pointerType === 'mouse') { mouse.active = true; mouse.x = p.x; mouse.y = p.y; return; }
    for (const s of ['move', 'aim']) if (sticks[s] && sticks[s].id === e.pointerId) { sticks[s].x = p.x; sticks[s].y = p.y; }
  });
  function endPointer(e) {
    if (e.pointerType === 'mouse') { mouse.down = false; return; }
    for (const s of ['move', 'aim']) if (sticks[s] && sticks[s].id === e.pointerId) sticks[s] = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  document.addEventListener('touchmove', e => { if (state === 'play') e.preventDefault(); }, { passive: false });

  function stickVec(s, dead) {
    if (!s) return null;
    const dx = s.x - s.ox, dy = s.y - s.oy, d = Math.hypot(dx, dy);
    if (d < dead) return null;
    return { x: dx / d, y: dy / d, m: Math.min(d, STICK_R) / STICK_R };
  }


  // ---------- effets ----------
  let debris = [], smokes = [], scorches = [], rings = [];
  function addSmoke(x, y, n, big) {
    if (smokes.length > 160) smokes.splice(0, smokes.length - 160);
    for (let i = 0; i < n; i++) {
      const m = Math.random() * 0.8 + 0.6;
      smokes.push({ x: x + (Math.random() - 0.5) * 10, y: y + (Math.random() - 0.5) * 10,
        vx: (Math.random() - 0.5) * 24, vy: (Math.random() - 0.5) * 24,
        r: (big ? 6 : 3) + Math.random() * 4, grow: (big ? 18 : 10) + Math.random() * 8,
        life: m + (big ? 0.5 : 0), max: m + (big ? 0.5 : 0) });
    }
  }
  function addDust(x, y, n, dir) {
    for (let i = 0; i < n; i++) {
      const a = dir + (Math.random() - 0.5) * 1.6, sp = 25 + Math.random() * 45;
      smokes.push({ x: x + (Math.random() - 0.5) * 8, y: y + (Math.random() - 0.5) * 8, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: 2.5 + Math.random() * 2.5, grow: 14 + Math.random() * 8, life: 0.35 + Math.random() * 0.25, max: 0.6, dust: true });
    }
  }
  function addDebris(x, y, dir, pieces) {
    if (debris.length > 240) debris.splice(0, debris.length - 240);
    for (const [w, h, color, shape] of pieces) {
      const a = dir + (Math.random() - 0.5) * 2, sp = 70 + Math.random() * 170;
      debris.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 16, w, h, color, shape: shape || 'rect' });
    }
  }
  function destroyDroid(d, dir) {
    Sound.play('destroy', d.x, d.y);
    d.deathAng = dir; d.deadT = 0; d.sparkT = 3.5;
    burst(d.x, d.y, '#FFB347', 26, 220); burst(d.x, d.y, '#FFFFFF', 8, 120);
    rings.push({ x: d.x, y: d.y, r: 5, life: 0.35, max: 0.35 });
    addSmoke(d.x, d.y, 7, true);
    bakeScorch({ x: d.x, y: d.y, r: 15 + Math.random() * 5 });
    const P = DROID_PAL[d.ecls];
    addDebris(d.x, d.y, dir, [
      [9, 4.5, P.head, 'ellipse'],               // tête

      [12, 3, P.dark],                           // arme
      [3.5, 3, P.scrap], [4, 2, P.scrap], [3, 2.5, P.line], [2.5, 2.5, P.line]
    ].concat(d.ecls === 'lourd' ? [[14, 5, P.dark], [10, 6, P.body], [5, 4, P.scrap]] : []));
